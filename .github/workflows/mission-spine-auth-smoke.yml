name: prod27r4 staging rebaseline idempotency fix publisher

on:
  workflow_dispatch:
    inputs:
      full:
        description: Publish the exact tested prod27r4 staging rebaseline fix
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: prod27r4-staging-rebaseline-idempotency-fix-publish
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.ref == 'refs/heads/chore/prod27r4-idempotent-rebaseline-publish-v2-20260912' &&
      inputs.full
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment: mission-spine-production-off
    permissions:
      contents: read
      deployments: write
    env:
      RELEASE_ID: ms-20260909-prod27r4
      MIGRATION_SHA: a5a6263f33a023ee11269c8f2d000758fce7b22c
      DIRECT_UPLOAD_SHA: ce21141303f05c24209b5de7cb52bae271a66e0d
      MAIN_SHA: b00835d41d32888b2d5092aa45a82fd4879bbcdd
      TARGET_SHA: e1758b8a0c9bc678c63354e432a371e6070401f3
      SEALED_SHA: 801bf75f47e5c8af67627a3a9ab6fc1f72b414a9
      HELPER_BASE_SHA: b00835d41d32888b2d5092aa45a82fd4879bbcdd
      HELPER_BRANCH: chore/prod27r4-idempotent-rebaseline-publish-v2-20260912
      TARGET_BRANCH: fix/prod27r4-idempotent-rebaseline-main-v2-20260912
      GITHUB_API_VERSION: "2026-03-10"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout the exact helper branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
          path: helper

      - name: Prove the exact one-shot helper context
        working-directory: helper
        env:
          INPUT_FULL: ${{ inputs.full }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_ACTOR" = "VelkaressiaBlutkrone"
          test "$GITHUB_TRIGGERING_ACTOR" = "VelkaressiaBlutkrone"
          test "$GITHUB_EVENT_NAME" = "workflow_dispatch"
          test "$GITHUB_RUN_ATTEMPT" = "1"
          test "$GITHUB_REF" = "refs/heads/$HELPER_BRANCH"
          test "$GITHUB_REF_NAME" = "$HELPER_BRANCH"
          test "$INPUT_FULL" = "true"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = "$HELPER_BASE_SHA"
          mapfile -t helper_paths < <(git diff-tree --no-commit-id --name-only -r HEAD)
          test "${#helper_paths[@]}" -eq 2
          test "${helper_paths[0]}" = ".github/workflows/mission-spine-auth-smoke.yml"
          test "${helper_paths[1]}" = "tests/release/test_prod27r4_rebaseline_fix_publish.py"
          current_main="$(
            gh api -H "X-GitHub-Api-Version: $GITHUB_API_VERSION" \
              "repos/$GITHUB_REPOSITORY/branches/main" --jq '.commit.sha'
          )"
          test "$current_main" = "$MAIN_SHA"

      - name: Checkout the exact tested staging rebaseline fix
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 2
          persist-credentials: false
          path: target

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"

      - uses: azure/setup-kubectl@829323503d1be3d00ca8346e5391ca0b07a9ab0d # v5.1.0
        with:
          version: v1.36.2

      - name: Test the exact staging rebaseline fix
        working-directory: target
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git rev-parse HEAD^)" = "$MAIN_SHA"
          test "$(git show -s --format=%s HEAD)" = \
            'fix(release): make staging rebaseline idempotent'
          test "$(git show -s --format=%an HEAD)" = 'devpath-gitops-release[bot]'
          test "$(git show -s --format=%cn HEAD)" = 'devpath-gitops-release[bot]'
          mapfile -t target_rows < <(git diff-tree --no-commit-id --name-status -r HEAD)
          test "${#target_rows[@]}" -eq 6
          test "${target_rows[0]}" = $'M\t.github/workflows/mission-spine-promote.yml'
          test "${target_rows[1]}" = $'A\tscripts/release/inspect_staging_web_phase.py'
          test "${target_rows[2]}" = $'M\tscripts/release/verify_promotion_chain.py'
          test "${target_rows[3]}" = $'A\ttests/release/test_inspect_staging_web_phase.py'
          test "${target_rows[4]}" = $'M\ttests/release/test_production_workflow_wiring.py'
          test "${target_rows[5]}" = $'M\ttests/release/test_promotion_chain.py'
          git diff --check "$MAIN_SHA" "$TARGET_SHA"
          python -m pip install --disable-pip-version-check \
            jsonschema==4.25.1 PyYAML==6.0.2
          python -m unittest discover -s tests/release -p 'test_*.py'

      - name: Checkout the exact sealed release as data
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ env.SEALED_SHA }}
          fetch-depth: 3
          persist-credentials: false
          path: sealed-release

      - name: Mint the production-scoped release App token
        id: app_token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.GITOPS_RELEASE_APP_ID }}
          private-key: ${{ secrets.GITOPS_RELEASE_APP_PRIVATE_KEY }}
          owner: DevPathAi
          permission-administration: read
          permission-contents: write

      - name: Checkout current protected main with release App authority
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: DevPathAi/devpath-gitops
          ref: main
          token: ${{ steps.app_token.outputs.token }}
          fetch-depth: 0
          persist-credentials: true
          path: gitops-main

      - name: Authenticate authority, target graph, and release evidence
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
          APP_ID: ${{ secrets.GITOPS_RELEASE_APP_ID }}
          APP_SLUG: ${{ steps.app_token.outputs.app-slug }}
          INSTALLATION_ID: ${{ steps.app_token.outputs.installation-id }}
          RELEASE_EVIDENCE_TOKEN: ${{ secrets.RELEASE_EVIDENCE_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${RELEASE_EVIDENCE_TOKEN:-}"
          python target/scripts/release/verify_gitops_write_authority.py \
            --expected-app-id "$APP_ID" --app-slug "$APP_SLUG" \
            --installation-id "$INSTALLATION_ID"
          test "$(git -C target rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git -C gitops-main rev-parse HEAD)" = "$MAIN_SHA"
          git -C gitops-main fetch --no-tags origin \
            "$TARGET_BRANCH:refs/remotes/origin/$TARGET_BRANCH"
          test "$(git -C gitops-main rev-parse "refs/remotes/origin/$TARGET_BRANCH")" = "$TARGET_SHA"
          test "$(git -C gitops-main rev-parse "$TARGET_SHA^")" = "$MAIN_SHA"
          python target/scripts/release/verify_migration_result.py \
            --root "$GITHUB_WORKSPACE/sealed-release" \
            --gitops-root "$GITHUB_WORKSPACE/gitops-main" \
            --release-id "$RELEASE_ID" >/dev/null
          before_output="$RUNNER_TEMP/prod27r4-rebaseline-chain-before"
          test ! -e "$before_output"
          touch "$before_output"
          python target/scripts/release/verify_promotion_chain.py \
            --root "$GITHUB_WORKSPACE/gitops-main" \
            --release-root "$GITHUB_WORKSPACE/sealed-release" \
            --release-id "$RELEASE_ID" --current "$TARGET_SHA" \
            --github-output "$before_output" >/dev/null
          test "$(sed -n 's/^phase=//p' "$before_output")" = "mission-on"
          test "$(sed -n 's/^migration_commit=//p' "$before_output")" = "$MIGRATION_SHA"
          test "$(sed -n 's/^landing_direct_upload_source_fix_commit=//p' "$before_output")" = "$DIRECT_UPLOAD_SHA"
          test "$(sed -n 's/^landing_wrangler_isolation_fix_commit=//p' "$before_output")" = "$MAIN_SHA"
          test "$(sed -n 's/^staging_rebaseline_idempotency_fix_commit=//p' "$before_output")" = "$TARGET_SHA"
          test "$(sed -n 's/^on_commit=//p' "$before_output")" = "$TARGET_SHA"
          test "$(sed -n 's/^current_commit=//p' "$before_output")" = "$TARGET_SHA"

      - name: Fast-forward protected main to the exact tested rebaseline fix
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
          APP_ID: ${{ secrets.GITOPS_RELEASE_APP_ID }}
          APP_SLUG: ${{ steps.app_token.outputs.app-slug }}
          INSTALLATION_ID: ${{ steps.app_token.outputs.installation-id }}
        run: |
          set -euo pipefail
          python target/scripts/release/verify_gitops_write_authority.py \
            --expected-app-id "$APP_ID" --app-slug "$APP_SLUG" \
            --installation-id "$INSTALLATION_ID"
          git -C gitops-main fetch --no-tags origin main:refs/remotes/origin/main
          test "$(git -C gitops-main rev-parse origin/main)" = "$MAIN_SHA"
          git -C gitops-main push origin "$TARGET_SHA:refs/heads/main"
          git -C gitops-main fetch --no-tags origin main:refs/remotes/origin/main
          test "$(git -C gitops-main rev-parse origin/main)" = "$TARGET_SHA"

      - name: Re-authenticate the published exact phase
        run: |
          set -euo pipefail
          after_output="$RUNNER_TEMP/prod27r4-rebaseline-chain-after"
          test ! -e "$after_output"
          touch "$after_output"
          python target/scripts/release/verify_promotion_chain.py \
            --root "$GITHUB_WORKSPACE/gitops-main" \
            --release-root "$GITHUB_WORKSPACE/sealed-release" \
            --release-id "$RELEASE_ID" --current refs/remotes/origin/main \
            --github-output "$after_output" >/dev/null
          test "$(sed -n 's/^phase=//p' "$after_output")" = "mission-on"
          test "$(sed -n 's/^migration_commit=//p' "$after_output")" = "$MIGRATION_SHA"
          test "$(sed -n 's/^landing_direct_upload_source_fix_commit=//p' "$after_output")" = "$DIRECT_UPLOAD_SHA"
          test "$(sed -n 's/^landing_wrangler_isolation_fix_commit=//p' "$after_output")" = "$MAIN_SHA"
          test "$(sed -n 's/^staging_rebaseline_idempotency_fix_commit=//p' "$after_output")" = "$TARGET_SHA"
          test "$(sed -n 's/^on_commit=//p' "$after_output")" = "$TARGET_SHA"
          test "$(sed -n 's/^current_commit=//p' "$after_output")" = "$TARGET_SHA"

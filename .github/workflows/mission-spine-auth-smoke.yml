# 봉인 절차 인증 스모크 — devpath-gitops-release App 자격 배선을 릴리스 없이 검증한다.
#
# 기본 잡(gitops-release-app): ①환경 비밀의 App id/PEM 으로 설치 토큰 민팅
# ②설치 신원(slug·설치 대상에 이 레포 포함) ③Administration read 실사용
# ④Contents write 스코프 보유(민팅의 요청 스코프 강제가 곧 증명).
#
# full=true 로 디스패치하면 full-write-authority 잡이 promote 와 동일한
# verify_gitops_write_authority.py 전체 검증을 돌린다. 이는 봉인 상태
# (설치 gitops 단독 · mission-spine-main-integrity/governance 룰셋 활성 ·
# 봉인형 classic 보호)가 전부 갖춰졌을 때만 green 이다 — 실패 지점이 곧
# 남은 봉인 복원 항목이다.
name: mission-spine-auth-smoke
on:
  workflow_dispatch:
    inputs:
      full:
        description: "verify_gitops_write_authority.py 전체 검증까지 실행"
        type: boolean
        default: false
permissions: {}
jobs:
  gitops-release-app:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: mission-spine-production-off
    steps:
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app_token
        with:
          app-id: ${{ secrets.GITOPS_RELEASE_APP_ID }}
          private-key: ${{ secrets.GITOPS_RELEASE_APP_PRIVATE_KEY }}
          owner: DevPathAi
          permission-administration: read
          permission-contents: write
      - name: Verify installation identity and effective permissions
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
          APP_SLUG: ${{ steps.app_token.outputs.app-slug }}
          INSTALLATION_ID: ${{ steps.app_token.outputs.installation-id }}
        run: |
          set -euo pipefail
          test "$APP_SLUG" = "devpath-gitops-release"
          test -n "$INSTALLATION_ID"
          repos=$(gh api /installation/repositories --jq '.repositories[].full_name')
          echo "installation repositories:"; echo "$repos"
          echo "$repos" | grep -qx "DevPathAi/devpath-gitops"
          # Administration read 실사용: 보호 설정을 읽을 수 있어야 한다.
          gh api repos/DevPathAi/devpath-gitops/branches/main/protection \
            --jq '{admins: .enforce_admins.enabled, linear: .required_linear_history.enabled}'
          # Contents write 스코프는 별도 확인이 불필요하다 — create-github-app-token 은
          # permission-contents: write 를 요청하며, App 에 그 권한이 없으면 민팅 자체가
          # 실패한다(스텝 1이 곧 스코프 증명).
          echo "auth smoke passed: app=$APP_SLUG installation=$INSTALLATION_ID"
  full-write-authority:
    if: github.ref == 'refs/heads/main' && inputs.full
    runs-on: ubuntu-latest
    environment: mission-spine-production-off
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app_token
        with:
          app-id: ${{ secrets.GITOPS_RELEASE_APP_ID }}
          private-key: ${{ secrets.GITOPS_RELEASE_APP_PRIVATE_KEY }}
          owner: DevPathAi
          permission-administration: read
          permission-contents: write
      - name: Verify the exact sealed write authority (promote-equivalent)
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
          APP_ID: ${{ secrets.GITOPS_RELEASE_APP_ID }}
          APP_SLUG: ${{ steps.app_token.outputs.app-slug }}
          INSTALLATION_ID: ${{ steps.app_token.outputs.installation-id }}
        run: |
          set -euo pipefail
          python3 scripts/release/verify_gitops_write_authority.py \
            --expected-app-id "$APP_ID" --app-slug "$APP_SLUG" \
            --installation-id "$INSTALLATION_ID"

  audit-evidence-token:
    if: github.ref == 'refs/heads/chore/prod26r4-evidence-token-audit'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verify identity and non-mutating Actions capability
        env:
          GH_TOKEN: ${{ secrets.RELEASE_EVIDENCE_TOKEN }}
          GITHUB_API_VERSION: "2026-03-10"
        run: |
          set -euo pipefail
          test "$GITHUB_ACTOR" = "VelkaressiaBlutkrone"
          test "$GITHUB_TRIGGERING_ACTOR" = "VelkaressiaBlutkrone"
          test "$GITHUB_RUN_ATTEMPT" = "1"
          test "$GITHUB_REF" = "refs/heads/chore/prod26r4-evidence-token-audit"

          token_login="$(gh api user --jq '.login')"
          printf 'token login: %s\n' "$token_login"
          [[ "$token_login" =~ ^[A-Za-z0-9]([A-Za-z0-9-]{0,37}[A-Za-z0-9])?$ ]]
          test "$token_login" != "VelkaressiaBlutkrone"
          test "$token_login" != "Qahnaarin"
          test "$(gh api user --jq '.type')" = "User"

          payload="$RUNNER_TEMP/prod26r4-capability-probe.json"
          response="$RUNNER_TEMP/prod26r4-capability-probe-response.txt"
          test ! -e "$payload"
          test ! -e "$response"
          umask 077
          jq -n '{
            "ref": "refs/heads/prod26r4-capability-probe-does-not-exist",
            "inputs": {
              "release_id": "ms-20260828-prod26r4",
              "source_sha": "4f245d61cc4924c9db0f3f3cbb90434ad0fe7d93",
              "sealed_release_sha": "e866a50f5ca535ebc1ed83343c651af064e424de",
              "gitops_source_sha": "eca2a73378eff8a9ce310f7ef997b51b7910984f",
              "release_manifest_sha256": "0b012f527ad30fde9a9cfdf9280377d84ef9a38da78987962ad86b38661a0575"
            }
          }' >"$payload"

          set +e
          gh api --include --method POST \
            -H "X-GitHub-Api-Version: $GITHUB_API_VERSION" \
            --input "$payload" \
            repos/DevPathAi/devpath-shared/actions/workflows/335839429/dispatches \
            >"$response" 2>&1
          probe_exit="$?"
          set -e
          test "$probe_exit" -ne 0
          probe_status="$(
            awk '$1 ~ /^HTTP\// && $2 ~ /^[0-9][0-9][0-9]$/ { code=$2 } END { print code }' \
              "$response"
          )"
          test "$probe_status" = "422"

          {
            echo "### RELEASE_EVIDENCE_TOKEN audit"
            echo "- login: $token_login"
            echo "- invalid-ref dispatch status: $probe_status"
            echo "- no workflow run was requested or created"
          } >>"$GITHUB_STEP_SUMMARY"

  audit-synthetic-probe-token:
    if: github.ref == 'refs/heads/chore/prod26r4-evidence-token-audit'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verify authentication and non-mutating Actions capability
        env:
          GH_TOKEN: ${{ secrets.MISSION_SYNTHETIC_PROBE_TOKEN }}
          GITHUB_API_VERSION: "2026-03-10"
        run: |
          set -euo pipefail
          test "$GITHUB_ACTOR" = "VelkaressiaBlutkrone"
          test "$GITHUB_TRIGGERING_ACTOR" = "VelkaressiaBlutkrone"
          test "$GITHUB_RUN_ATTEMPT" = "1"
          test "$GITHUB_REF" = "refs/heads/chore/prod26r4-evidence-token-audit"

          auth_error="$RUNNER_TEMP/prod26r4-synthetic-auth-error.txt"
          test ! -e "$auth_error"
          umask 077
          set +e
          token_login="$(gh api user --jq '.login' 2>"$auth_error")"
          auth_exit="$?"
          set -e
          if [ "$auth_exit" -ne 0 ]; then
            echo "synthetic token authenticated: false"
            exit 1
          fi

          printf 'synthetic token login: %s\n' "$token_login"
          [[ "$token_login" =~ ^[A-Za-z0-9]([A-Za-z0-9-]{0,37}[A-Za-z0-9])?$ ]]
          test "$token_login" != "VelkaressiaBlutkrone"
          test "$token_login" != "Qahnaarin"
          test "$(gh api user --jq '.type')" = "User"

          payload="$RUNNER_TEMP/prod26r4-synthetic-capability-probe.json"
          response="$RUNNER_TEMP/prod26r4-synthetic-capability-probe-response.txt"
          test ! -e "$payload"
          test ! -e "$response"
          jq -n '{
            "ref": "refs/heads/prod26r4-capability-probe-does-not-exist",
            "inputs": {
              "release_id": "ms-20260828-prod26r4",
              "source_sha": "4f245d61cc4924c9db0f3f3cbb90434ad0fe7d93",
              "sealed_release_sha": "e866a50f5ca535ebc1ed83343c651af064e424de",
              "gitops_source_sha": "eca2a73378eff8a9ce310f7ef997b51b7910984f",
              "release_manifest_sha256": "0b012f527ad30fde9a9cfdf9280377d84ef9a38da78987962ad86b38661a0575"
            }
          }' >"$payload"

          set +e
          gh api --include --method POST \
            -H "X-GitHub-Api-Version: $GITHUB_API_VERSION" \
            --input "$payload" \
            repos/DevPathAi/devpath-shared/actions/workflows/335839429/dispatches \
            >"$response" 2>&1
          probe_exit="$?"
          set -e
          test "$probe_exit" -ne 0
          probe_status="$(
            awk '$1 ~ /^HTTP\// && $2 ~ /^[0-9][0-9][0-9]$/ { code=$2 } END { print code }' \
              "$response"
          )"
          test "$probe_status" = "422"

          {
            echo "### MISSION_SYNTHETIC_PROBE_TOKEN audit"
            echo "- login: $token_login"
            echo "- invalid-ref dispatch status: $probe_status"
            echo "- no workflow run was requested or created"
          } >>"$GITHUB_STEP_SUMMARY"

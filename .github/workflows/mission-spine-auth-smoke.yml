name: prod26r9 canary runtime image form fix publisher

on:
  workflow_dispatch:
    inputs:
      full:
        description: Publish the exact tested prod26r9 canary runtime image form fix
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: prod26r9-canary-runtime-image-form-fix-publish
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.ref == 'refs/heads/chore/prod26r9-et11-runtime-fix-publish' &&
      inputs.full
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: mission-spine-production-on
    permissions:
      contents: read
      deployments: write
    env:
      RELEASE_ID: ms-20260830-prod26r9
      MIGRATION_SHA: 5bcde50ed982c9b5382f7b87579a4096212c1b1b
      APPROVAL_FIX_SHA: 6ab7b95a2f981be176469300c1ce4693a5163952
      RUNTIME_FIX_SHA: 0576f3a52a02b3c434ab8b0931b53cc543e490ae
      ADMISSION_FIX_SHA: 6f3d57e555a92a9ff1941728cc32312feaf03ef3
      IDENTITY_FIX_SHA: 4544e2c5a8ccd59aa50a6823a0eb803b3aac8bd8
      SERVICES_SHA: b55dbd48ecd323b2a6d51b4a5319c951928b3c0a
      STATUS_FIX_SHA: aaef09d39df61f1561f32ce616a498a00585c068
      SOURCE_STATUS_FIX_SHA: cc9d0424f7a2dc1d962e4bb7e820248373cc40e4
      OFF_SHA: 711273896cd3e6c8130ba8fab4b1683e08340260
      MAIN_SHA: ab72e59f903be8b243ccd129a7d6e44de9ec1b1f
      TARGET_SHA: e4408b007d2104a6a2743a1237ce2b9bd62a50ee
      SEALED_SHA: 9ae75a2f0dc9f22f2383775fd2f785d510f93740
      HELPER_BASE_SHA: 6c73e41301b85290796291fe4d17bdf4c59e9c7b
      HELPER_BRANCH: chore/prod26r9-et11-runtime-fix-publish
      TARGET_BRANCH: fix/prod26r9-shared-migration-approval-contract
      GITHUB_API_VERSION: "2026-03-10"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout the exact helper branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
          path: helper

      - name: Prove the exact one-shot helper context
        working-directory: helper
        env:
          INPUT_FULL: ${{ inputs.full }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_ACTOR" = "VelkaressiaBlutkrone"
          test "$GITHUB_TRIGGERING_ACTOR" = "VelkaressiaBlutkrone"
          test "$GITHUB_EVENT_NAME" = "workflow_dispatch"
          test "$GITHUB_RUN_ATTEMPT" = "1"
          test "$GITHUB_REF" = "refs/heads/$HELPER_BRANCH"
          test "$GITHUB_REF_NAME" = "$HELPER_BRANCH"
          test "$INPUT_FULL" = "true"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = "$HELPER_BASE_SHA"
          mapfile -t helper_paths < <(git diff-tree --no-commit-id --name-only -r HEAD)
          test "${#helper_paths[@]}" -eq 2
          test "${helper_paths[0]}" = ".github/workflows/mission-spine-auth-smoke.yml"
          test "${helper_paths[1]}" = "tests/release/test_prod26r9_et11_runtime_fix_publish.py"
          current_main="$(
            gh api -H "X-GitHub-Api-Version: $GITHUB_API_VERSION" \
              "repos/$GITHUB_REPOSITORY/branches/main" --jq '.commit.sha'
          )"
          test "$current_main" = "$MAIN_SHA"

      - name: Checkout the exact tested canary runtime image form fix
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 2
          persist-credentials: false
          path: target

      - name: Test the exact canary runtime image form fix
        working-directory: target
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git rev-parse HEAD^)" = "$MAIN_SHA"
          test "$(git show -s --format=%s HEAD)" = \
            'fix(release): align canary runtime image forms'
          test "$(git show -s --format=%an HEAD)" = 'devpath-gitops-release[bot]'
          test "$(git show -s --format=%cn HEAD)" = 'devpath-gitops-release[bot]'
          mapfile -t target_paths < <(git diff-tree --no-commit-id --name-only -r HEAD)
          test "${#target_paths[@]}" -eq 9
          test "${target_paths[0]}" = "scripts/release/build_production_canary.py"
          test "${target_paths[1]}" = "scripts/release/verify_oci_images.py"
          test "${target_paths[2]}" = "scripts/release/verify_promotion_chain.py"
          test "${target_paths[3]}" = "scripts/release/verify_promotion_evidence.py"
          test "${target_paths[4]}" = "tests/release/test_oci_image_trust.py"
          test "${target_paths[5]}" = "tests/release/test_production_canary.py"
          test "${target_paths[6]}" = "tests/release/test_promotion_chain.py"
          test "${target_paths[7]}" = "tests/release/test_promotion_evidence.py"
          test "${target_paths[8]}" = "tests/release/test_release_contract.py"
          git diff --check "$MAIN_SHA" "$TARGET_SHA"
          python3 -m unittest discover -s tests/release

      - name: Checkout the exact sealed release as data
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ env.SEALED_SHA }}
          fetch-depth: 3
          persist-credentials: false
          path: sealed-release

      - name: Mint the production-scoped release App token
        id: app_token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.GITOPS_RELEASE_APP_ID }}
          private-key: ${{ secrets.GITOPS_RELEASE_APP_PRIVATE_KEY }}
          owner: DevPathAi
          permission-administration: read
          permission-contents: write

      - name: Checkout current protected main with release App authority
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: DevPathAi/devpath-gitops
          ref: main
          token: ${{ steps.app_token.outputs.token }}
          fetch-depth: 0
          persist-credentials: true
          path: gitops-main

      - name: Authenticate authority, target graph, and live migration evidence
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
          APP_ID: ${{ secrets.GITOPS_RELEASE_APP_ID }}
          APP_SLUG: ${{ steps.app_token.outputs.app-slug }}
          INSTALLATION_ID: ${{ steps.app_token.outputs.installation-id }}
          RELEASE_EVIDENCE_TOKEN: ${{ secrets.RELEASE_EVIDENCE_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${RELEASE_EVIDENCE_TOKEN:-}"
          python target/scripts/release/verify_gitops_write_authority.py \
            --expected-app-id "$APP_ID" --app-slug "$APP_SLUG" \
            --installation-id "$INSTALLATION_ID"
          test "$(git -C target rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git -C gitops-main rev-parse HEAD)" = "$MAIN_SHA"
          git -C gitops-main fetch --no-tags origin \
            "$TARGET_BRANCH:refs/remotes/origin/$TARGET_BRANCH"
          test "$(git -C gitops-main rev-parse "refs/remotes/origin/$TARGET_BRANCH")" = "$TARGET_SHA"
          test "$(git -C gitops-main rev-parse "$TARGET_SHA^")" = "$MAIN_SHA"
          python target/scripts/release/verify_migration_result.py \
            --root "$GITHUB_WORKSPACE/sealed-release" \
            --gitops-root "$GITHUB_WORKSPACE/gitops-main" \
            --release-id "$RELEASE_ID" >/dev/null
          before_output="$RUNNER_TEMP/prod26r9-et11-chain-before-publish"
          test ! -e "$before_output"
          touch "$before_output"
          python target/scripts/release/verify_promotion_chain.py \
            --root "$GITHUB_WORKSPACE/gitops-main" \
            --release-root "$GITHUB_WORKSPACE/sealed-release" \
            --release-id "$RELEASE_ID" --current "$TARGET_SHA" \
            --github-output "$before_output" >/dev/null
          phase="$(sed -n 's/^phase=//p' "$before_output")"
          migration_commit="$(sed -n 's/^migration_commit=//p' "$before_output")"
          approval_fix_commit="$(sed -n 's/^shared_migration_approval_fix_commit=//p' "$before_output")"
          runtime_fix_commit="$(sed -n 's/^migration_runtime_fix_commit=//p' "$before_output")"
          admission_fix_commit="$(sed -n 's/^migration_runtime_admission_fix_commit=//p' "$before_output")"
          identity_fix_commit="$(sed -n 's/^migration_preflight_identity_fix_commit=//p' "$before_output")"
          services_commit="$(sed -n 's/^services_commit=//p' "$before_output")"
          status_image_fix_commit="$(sed -n 's/^service_status_image_fix_commit=//p' "$before_output")"
          source_status_fix_commit="$(sed -n 's/^service_source_status_fix_commit=//p' "$before_output")"
          off_commit="$(sed -n 's/^off_commit=//p' "$before_output")"
          on_commit="$(sed -n 's/^on_commit=//p' "$before_output")"
          canary_form_fix_commit="$(sed -n 's/^canary_runtime_form_fix_commit=//p' "$before_output")"
          current_commit="$(sed -n 's/^current_commit=//p' "$before_output")"
          test "$phase" = "mission-on"
          test "$migration_commit" = "$MIGRATION_SHA"
          test "$approval_fix_commit" = "$APPROVAL_FIX_SHA"
          test "$runtime_fix_commit" = "$RUNTIME_FIX_SHA"
          test "$admission_fix_commit" = "$ADMISSION_FIX_SHA"
          test "$identity_fix_commit" = "$IDENTITY_FIX_SHA"
          test "$services_commit" = "$SERVICES_SHA"
          test "$status_image_fix_commit" = "$STATUS_FIX_SHA"
          test "$source_status_fix_commit" = "$SOURCE_STATUS_FIX_SHA"
          test "$off_commit" = "$OFF_SHA"
          test "$on_commit" = "$MAIN_SHA"
          test "$canary_form_fix_commit" = "$TARGET_SHA"
          test "$current_commit" = "$TARGET_SHA"

      - name: Fast-forward protected main to the exact tested canary runtime image form fix
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
          APP_ID: ${{ secrets.GITOPS_RELEASE_APP_ID }}
          APP_SLUG: ${{ steps.app_token.outputs.app-slug }}
          INSTALLATION_ID: ${{ steps.app_token.outputs.installation-id }}
        run: |
          set -euo pipefail
          python target/scripts/release/verify_gitops_write_authority.py \
            --expected-app-id "$APP_ID" --app-slug "$APP_SLUG" \
            --installation-id "$INSTALLATION_ID"
          git -C gitops-main fetch --no-tags origin main:refs/remotes/origin/main
          test "$(git -C gitops-main rev-parse origin/main)" = "$MAIN_SHA"
          git -C gitops-main push origin "$TARGET_SHA:refs/heads/main"
          git -C gitops-main fetch --no-tags origin main:refs/remotes/origin/main
          test "$(git -C gitops-main rev-parse origin/main)" = "$TARGET_SHA"

      - name: Re-authenticate the published exact phase
        run: |
          set -euo pipefail
          after_output="$RUNNER_TEMP/prod26r9-et11-chain-after-publish"
          test ! -e "$after_output"
          touch "$after_output"
          python target/scripts/release/verify_promotion_chain.py \
            --root "$GITHUB_WORKSPACE/gitops-main" \
            --release-root "$GITHUB_WORKSPACE/sealed-release" \
            --release-id "$RELEASE_ID" --current refs/remotes/origin/main \
            --github-output "$after_output" >/dev/null
          phase="$(sed -n 's/^phase=//p' "$after_output")"
          migration_commit="$(sed -n 's/^migration_commit=//p' "$after_output")"
          approval_fix_commit="$(sed -n 's/^shared_migration_approval_fix_commit=//p' "$after_output")"
          runtime_fix_commit="$(sed -n 's/^migration_runtime_fix_commit=//p' "$after_output")"
          admission_fix_commit="$(sed -n 's/^migration_runtime_admission_fix_commit=//p' "$after_output")"
          identity_fix_commit="$(sed -n 's/^migration_preflight_identity_fix_commit=//p' "$after_output")"
          services_commit="$(sed -n 's/^services_commit=//p' "$after_output")"
          status_image_fix_commit="$(sed -n 's/^service_status_image_fix_commit=//p' "$after_output")"
          source_status_fix_commit="$(sed -n 's/^service_source_status_fix_commit=//p' "$after_output")"
          off_commit="$(sed -n 's/^off_commit=//p' "$after_output")"
          on_commit="$(sed -n 's/^on_commit=//p' "$after_output")"
          canary_form_fix_commit="$(sed -n 's/^canary_runtime_form_fix_commit=//p' "$after_output")"
          current_commit="$(sed -n 's/^current_commit=//p' "$after_output")"
          test "$phase" = "mission-on"
          test "$migration_commit" = "$MIGRATION_SHA"
          test "$approval_fix_commit" = "$APPROVAL_FIX_SHA"
          test "$runtime_fix_commit" = "$RUNTIME_FIX_SHA"
          test "$admission_fix_commit" = "$ADMISSION_FIX_SHA"
          test "$identity_fix_commit" = "$IDENTITY_FIX_SHA"
          test "$services_commit" = "$SERVICES_SHA"
          test "$status_image_fix_commit" = "$STATUS_FIX_SHA"
          test "$source_status_fix_commit" = "$SOURCE_STATUS_FIX_SHA"
          test "$off_commit" = "$OFF_SHA"
          test "$on_commit" = "$MAIN_SHA"
          test "$canary_form_fix_commit" = "$TARGET_SHA"
          test "$current_commit" = "$TARGET_SHA"

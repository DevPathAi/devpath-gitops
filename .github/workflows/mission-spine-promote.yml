name: Mission Spine - production exact digest promotion

on:
  workflow_dispatch:
    inputs:
      release_id:
        description: Sealed Mission Spine release ID
        required: true
        type: string

permissions:
  actions: read
  contents: read

env:
  RELEASE_ID: ${{ inputs.release_id }}

concurrency:
  # Promotion, Landing-last, and rollback share this repository-wide lock.
  group: mission-spine-production
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      base_sha: ${{ steps.release.outputs.gitops_base_sha }}
      candidate_sha: ${{ steps.release.outputs.candidate_spec_sha256 }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Resolve sealed release
        id: release
        run: |
          set -euo pipefail
          python scripts/release/validate_release_manifest.py --root "$GITHUB_WORKSPACE" \
            --release-id "$RELEASE_ID" --emit-github-output "$GITHUB_OUTPUT"
      - name: Compare-and-swap current main against sealed GitOps base
        env:
          BASE_SHA: ${{ steps.release.outputs.gitops_base_sha }}
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$BASE_SHA"
          git merge-base --is-ancestor "$BASE_SHA" HEAD
          mapfile -t branch_changes < <(git diff --name-only "$BASE_SHA"...HEAD)
          test "${#branch_changes[@]}" -eq 2
          test "${branch_changes[0]}" = "release-manifests/candidates/$RELEASE_ID.candidate-spec.json"
          test "${branch_changes[1]}" = "release-manifests/releases/$RELEASE_ID.json"

  production_off:
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: mission-spine-production-off
    permissions:
      actions: read
      contents: write
      deployments: write
    outputs:
      off_commit: ${{ steps.commit.outputs.off_commit }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Require protected OFF approval
        env:
          GH_TOKEN: ${{ github.token }}
          ENVIRONMENT_NAME: mission-spine-production-off
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/environments/${ENVIRONMENT_NAME}" \
            | jq -e '[.protection_rules[]? | select(.type == "required_reviewers" and .prevent_self_review == true and ((.reviewers // []) | length > 0))] | length == 1' >/dev/null
      - name: Verify successful validation and every sealed artifact
        env:
          RELEASE_EVIDENCE_TOKEN: ${{ secrets.RELEASE_EVIDENCE_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${RELEASE_EVIDENCE_TOKEN:-}"
          python scripts/release/verify_release_artifacts.py --root "$GITHUB_WORKSPACE" \
            --release-id "$RELEASE_ID"
      - name: Compare-and-swap exact mission-OFF digest
        id: commit
        env:
          BASE_SHA: ${{ needs.resolve.outputs.base_sha }}
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$BASE_SHA"
          main_worktree="$RUNNER_TEMP/gitops-main-off"
          git worktree add --detach "$main_worktree" "$BASE_SHA"
          python scripts/release/set_web_digest.py --root "$main_worktree" \
            --manifest-root "$GITHUB_WORKSPACE" --release-id "$RELEASE_ID" \
            --target mission-off --expected-current base
          test "$(git -C "$main_worktree" diff --name-only)" = "apps/devpath-web/base/kustomization.yaml"
          kubectl kustomize "$main_worktree/apps/devpath-web/base" >/dev/null
          git -C "$main_worktree" config user.name "devpath-release-bot"
          git -C "$main_worktree" config user.email "release-bot@users.noreply.github.com"
          git -C "$main_worktree" add apps/devpath-web/base/kustomization.yaml
          git -C "$main_worktree" commit -m "release(web): promote $RELEASE_ID mission-off"
          git -C "$main_worktree" push origin HEAD:main
          echo "off_commit=$(git -C "$main_worktree" rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Configure production cluster
        env:
          PRODUCTION_KUBECONFIG_B64: ${{ secrets.PRODUCTION_KUBECONFIG_B64 }}
        run: |
          set -euo pipefail
          test -n "${PRODUCTION_KUBECONFIG_B64:-}"
          umask 077
          printf '%s' "$PRODUCTION_KUBECONFIG_B64" | base64 --decode > "$RUNNER_TEMP/production-kubeconfig"
          chmod 600 "$RUNNER_TEMP/production-kubeconfig"
          echo "KUBECONFIG=$RUNNER_TEMP/production-kubeconfig" >> "$GITHUB_ENV"
      - name: Detect OFF sync within 300 seconds
        run: |
          python scripts/release/wait_web_rollout.py --root "$GITHUB_WORKSPACE" \
            --release-id "$RELEASE_ID" --environment production \
            --phase mission-off --canary-seconds 0

  production_on:
    needs: [resolve, production_off]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: mission-spine-production-on
    permissions:
      actions: read
      contents: write
      deployments: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Require protected manual ON approval
        env:
          GH_TOKEN: ${{ github.token }}
          ENVIRONMENT_NAME: mission-spine-production-on
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/environments/${ENVIRONMENT_NAME}" \
            | jq -e '[.protection_rules[]? | select(.type == "required_reviewers" and .prevent_self_review == true and ((.reviewers // []) | length > 0))] | length == 1' >/dev/null
      - name: Compare-and-swap exact mission-ON digest
        id: commit
        env:
          OFF_COMMIT: ${{ needs.production_off.outputs.off_commit }}
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$OFF_COMMIT"
          main_worktree="$RUNNER_TEMP/gitops-main-on"
          git worktree add --detach "$main_worktree" "$OFF_COMMIT"
          python scripts/release/set_web_digest.py --root "$main_worktree" \
            --manifest-root "$GITHUB_WORKSPACE" --release-id "$RELEASE_ID" \
            --target mission-on --expected-current mission-off
          test "$(git -C "$main_worktree" diff --name-only)" = "apps/devpath-web/base/kustomization.yaml"
          kubectl kustomize "$main_worktree/apps/devpath-web/base" >/dev/null
          git -C "$main_worktree" config user.name "devpath-release-bot"
          git -C "$main_worktree" config user.email "release-bot@users.noreply.github.com"
          git -C "$main_worktree" add apps/devpath-web/base/kustomization.yaml
          git -C "$main_worktree" commit -m "release(web): promote $RELEASE_ID mission-on"
          git -C "$main_worktree" push origin HEAD:main
          echo "on_commit=$(git -C "$main_worktree" rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Configure production cluster
        env:
          PRODUCTION_KUBECONFIG_B64: ${{ secrets.PRODUCTION_KUBECONFIG_B64 }}
        run: |
          set -euo pipefail
          test -n "${PRODUCTION_KUBECONFIG_B64:-}"
          umask 077
          printf '%s' "$PRODUCTION_KUBECONFIG_B64" | base64 --decode > "$RUNNER_TEMP/production-kubeconfig"
          chmod 600 "$RUNNER_TEMP/production-kubeconfig"
          echo "KUBECONFIG=$RUNNER_TEMP/production-kubeconfig" >> "$GITHUB_ENV"
      - name: Detect sync within 300 seconds and hold exact 900-second canary
        id: rollout
        run: |
          python scripts/release/wait_web_rollout.py --root "$GITHUB_WORKSPACE" \
            --release-id "$RELEASE_ID" --environment production \
            --phase mission-on --canary-seconds 900 --github-output "$GITHUB_OUTPUT"
      - name: Record sanitized production canary evidence
        env:
          CANDIDATE_SHA: ${{ needs.resolve.outputs.candidate_sha }}
          ON_COMMIT: ${{ steps.commit.outputs.on_commit }}
          SYNC_SECONDS: ${{ steps.rollout.outputs.sync_detection_seconds }}
          CANARY_SECONDS: ${{ steps.rollout.outputs.canary_seconds }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/production-canary"
          printf '{"release_id":"%s","candidate_spec_sha256":"%s","status":"passed","on_commit":"%s","sync_detection_seconds":%s,"canary_seconds":%s}\n' \
            "$RELEASE_ID" "$CANDIDATE_SHA" "$ON_COMMIT" "$SYNC_SECONDS" "$CANARY_SECONDS" \
            > "$RUNNER_TEMP/production-canary/evidence.json"
      - uses: actions/upload-artifact@v6
        with:
          name: ${{ inputs.release_id }}-production-canary
          path: ${{ runner.temp }}/production-canary/evidence.json
          if-no-files-found: error
          retention-days: 30

name: Mission Spine main PR policy

on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: mission-spine-main-pr-policy-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  mission-spine-main-pr-policy:
    name: mission-spine-main-pr-policy
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Run the immutable base policy against the exact PR head
        env:
          POLICY_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          POLICY_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = pull_request_target
          test "$GITHUB_REPOSITORY" = DevPathAi/devpath-gitops
          test "$GITHUB_BASE_REF" = main
          [[ "$POLICY_BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$POLICY_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]
          test "$(git rev-parse HEAD)" = "$POLICY_BASE_SHA"
          git fetch --no-tags --force origin \
            "refs/pull/$PR_NUMBER/head:refs/mission-spine-policy/pr-head"
          fetched_head="$(git rev-parse refs/mission-spine-policy/pr-head)"
          test "$fetched_head" = "$POLICY_HEAD_SHA"
          python3 scripts/release/verify_main_pr_policy.py \
            --base "$POLICY_BASE_SHA" --head "$POLICY_HEAD_SHA"

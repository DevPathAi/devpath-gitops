---
name: Mission Spine Release Gate Dispatch

'on':
  push:
    branches:
      - automation/dispatch-ms-20260920-community-flat-pages

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    name: Dispatch protected release gate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Dispatch GitOps validation as GitHub Actions automation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api \
            --method POST \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/mission-spine-validate.yml/dispatches" \
            --input - <<'JSON'
          {
            "ref": "main",
            "inputs": {
              "release_id": "ms-20260920-community-flat-pages"
            }
          }
          JSON

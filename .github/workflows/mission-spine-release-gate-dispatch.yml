---
name: Mission Spine Release Gate Dispatch

'on':
  push:
    branches:
      - automation/dispatch-ms-20260916-community-ia

permissions:
  contents: read

jobs:
  diagnose-cloudflare:
    name: Diagnose Cloudflare read-only status
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: mission-spine-production-landing
    steps:
      - name: Report endpoint status codes without response bodies
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          python - <<'PY'
          import os
          from urllib.error import HTTPError, URLError
          from urllib.request import Request, urlopen

          token = os.environ.get("CLOUDFLARE_API_TOKEN", "")
          if not token:
              raise SystemExit("Cloudflare token is unavailable")
          root = "https://api.cloudflare.com/client/v4"
          base = "/accounts/f74eb88cda37ff4f8e6c27aaaf91631c/pages/projects/devpath-home-page"
          paths = {
              "token": "/user/tokens/verify",
              "project": base,
              "candidate": base + "/deployments/1496e6fc-c0ab-41be-b3bb-718911757941",
              "recorded_prior": base + "/deployments/740c6ab4-c035-458d-9cf6-5bafd9c397fc",
              "previous_release_current": base + "/deployments/43c62c16-872d-48e7-8c14-078248c1d54b",
          }
          failed = False
          for label, path in paths.items():
              request = Request(
                  root + path,
                  headers={
                      "Authorization": f"Bearer {token}",
                      "User-Agent": "devpath-readonly-diagnostic/1",
                  },
              )
              try:
                  with urlopen(request, timeout=20) as response:
                      status = response.status
                      response.read(1)
              except HTTPError as error:
                  status = error.code
                  failed = True
              except URLError:
                  status = "network-error"
                  failed = True
              print(f"{label}={status}")
          raise SystemExit(1 if failed else 0)
          PY

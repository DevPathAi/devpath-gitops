name: Mission Spine - reverse rollback

on:
  workflow_dispatch:
    inputs:
      release_id:
        description: Sealed Mission Spine release ID
        required: true
        type: string

permissions:
  actions: read
  contents: read
  deployments: write

env:
  RELEASE_ID: ${{ inputs.release_id }}
  PYTHONDONTWRITEBYTECODE: "1"

concurrency:
  group: mission-spine-production
  cancel-in-progress: false

jobs:
  reverse-rollback:
    name: Reverse web and Landing while retaining migration and services
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: mission-spine-production-rollback
    outputs:
      prior_commit: ${{ steps.rollback_prior.outputs.prior_commit }}
    steps:
      - name: Checkout exact protected-main control bytes
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
          path: control
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
      - name: Authenticate current protected main control before rollback approval
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python control/scripts/release/verify_main_release_context.py \
            --control-root "$GITHUB_WORKSPACE/control" \
            --workflow-path .github/workflows/mission-spine-rollback.yml \
            --release-id "$RELEASE_ID" --mode control
      - name: Authenticate this attempt-one protected rollback approval
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python control/scripts/release/verify_current_protected_approval.py \
            --environment mission-spine-production-rollback \
            --job-name 'Reverse web and Landing while retaining migration and services' \
            --workflow-path .github/workflows/mission-spine-rollback.yml
      - name: Checkout sealed release branch as data only
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: release/candidate-${{ inputs.release_id }}
          fetch-depth: 0
          persist-credentials: false
          path: sealed-release
      - name: Authenticate unchanged current main and exact sealed data
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python control/scripts/release/verify_main_release_context.py \
            --control-root "$GITHUB_WORKSPACE/control" \
            --data-root "$GITHUB_WORKSPACE/sealed-release" \
            --workflow-path .github/workflows/mission-spine-rollback.yml \
            --release-id "$RELEASE_ID" --mode sealed
      - name: Install the exact release renderer
        run: |
          set -euo pipefail
          python control/scripts/release/install_pinned_kustomize.py \
            --destination "$RUNNER_TEMP/mission-spine-kustomize"
          echo "MISSION_SPINE_KUSTOMIZE_BIN=$RUNNER_TEMP/mission-spine-kustomize/kustomize" \
            >> "$GITHUB_ENV"
      - name: Resolve and authenticate the sealed release
        id: release
        env:
          RELEASE_EVIDENCE_TOKEN: ${{ secrets.RELEASE_EVIDENCE_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${RELEASE_EVIDENCE_TOKEN:-}"
          python control/scripts/release/validate_release_manifest.py \
            --root "$GITHUB_WORKSPACE/sealed-release" --release-id "$RELEASE_ID" \
            --emit-github-output "$GITHUB_OUTPUT"
          python control/scripts/release/verify_release_artifacts.py \
            --root "$GITHUB_WORKSPACE/sealed-release" --release-id "$RELEASE_ID"
      - name: Mint the environment-scoped GitOps release App token
        id: app_token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.GITOPS_RELEASE_APP_ID }}
          private-key: ${{ secrets.GITOPS_RELEASE_APP_PRIVATE_KEY }}
          owner: DevPathAi
          permission-administration: read
          permission-contents: write
      - name: Authenticate the exact App installation and main authority
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
          APP_ID: ${{ secrets.GITOPS_RELEASE_APP_ID }}
          APP_SLUG: ${{ steps.app_token.outputs.app-slug }}
          INSTALLATION_ID: ${{ steps.app_token.outputs.installation-id }}
        run: |
          set -euo pipefail
          python control/scripts/release/verify_gitops_write_authority.py \
            --expected-app-id "$APP_ID" --app-slug "$APP_SLUG" \
            --installation-id "$INSTALLATION_ID"
      - name: Checkout current GitOps main with the approved App token
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: DevPathAi/devpath-gitops
          ref: main
          token: ${{ steps.app_token.outputs.token }}
          path: gitops-main
          fetch-depth: 0
          persist-credentials: true
      - name: Inspect exact resumable rollback chain
        id: chain
        run: |
          set -euo pipefail
          git -C gitops-main fetch --no-tags origin main:refs/remotes/origin/main
          test "$(git -C gitops-main rev-parse refs/remotes/origin/main)" = "$GITHUB_SHA"
          test "$(git -C gitops-main rev-parse HEAD)" = "$GITHUB_SHA"
          python control/scripts/release/verify_promotion_chain.py \
            --root "$GITHUB_WORKSPACE/gitops-main" \
            --release-root "$GITHUB_WORKSPACE/sealed-release" \
            --release-id "$RELEASE_ID" --current refs/remotes/origin/main \
            --github-output "$GITHUB_OUTPUT" >/dev/null
          case "$(sed -n 's/^phase=//p' "$GITHUB_OUTPUT" | tail -1)" in
            migration|services|mission-off|mission-on|rollback-off|rollback-prior) ;;
            *) echo 'rollback cannot start from this exact chain phase' >&2; exit 1 ;;
          esac
      - name: Authenticate retained migration evidence
        env:
          RELEASE_EVIDENCE_TOKEN: ${{ secrets.RELEASE_EVIDENCE_TOKEN }}
        run: |
          set -euo pipefail
          python control/scripts/release/verify_migration_result.py \
            --root "$GITHUB_WORKSPACE/sealed-release" \
            --gitops-root "$GITHUB_WORKSPACE/gitops-main" \
            --release-id "$RELEASE_ID"
      - name: Authenticate Landing evidence and its referenced canary before rollback
        if: >-
          steps.chain.outputs.phase == 'mission-on' ||
          steps.chain.outputs.phase == 'rollback-off' ||
          steps.chain.outputs.phase == 'rollback-prior'
        id: landing
        env:
          RELEASE_EVIDENCE_TOKEN: ${{ secrets.RELEASE_EVIDENCE_TOKEN }}
        run: |
          set -euo pipefail
          python control/scripts/release/verify_landing_evidence.py \
            --root "$GITHUB_WORKSPACE/sealed-release" \
            --gitops-root "$GITHUB_WORKSPACE/gitops-main" \
            --release-id "$RELEASE_ID" --github-output "$GITHUB_OUTPUT"
      - name: Roll back or reverify exact Landing prior before web rollback
        id: landing_prior
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CURRENT_PHASE: ${{ steps.chain.outputs.phase }}
          LANDING_DEPLOYMENT_ID: ${{ steps.landing.outputs.deployment_id }}
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          echo "ROLLBACK_STARTED=$(date +%s)" >> "$GITHUB_ENV"
          case "$CURRENT_PHASE" in
            mission-on)
              test -n "$LANDING_DEPLOYMENT_ID"
              python control/scripts/release/cloudflare_pages.py \
                --root "$GITHUB_WORKSPACE/sealed-release" --release-id "$RELEASE_ID" \
                --action rollback-prior --deployment-id "$LANDING_DEPLOYMENT_ID"
              ;;
            rollback-off|rollback-prior|migration|services|mission-off)
              python control/scripts/release/cloudflare_pages.py \
                --root "$GITHUB_WORKSPACE/sealed-release" --release-id "$RELEASE_ID" \
                --action verify-prior
              ;;
            *) exit 1 ;;
          esac
      - uses: azure/setup-kubectl@829323503d1be3d00ca8346e5391ca0b07a9ab0d # v5.1.0
        with:
          version: v1.36.2
      - name: Configure the production cluster
        env:
          PRODUCTION_KUBECONFIG_B64: ${{ secrets.PRODUCTION_KUBECONFIG_B64 }}
        run: |
          set -euo pipefail
          test -n "${PRODUCTION_KUBECONFIG_B64:-}"
          python control/scripts/release/manage_production_kubeconfig.py create \
            --runner-temp "$RUNNER_TEMP" --github-env "$GITHUB_ENV"
      - name: Re-observe retained completed migration runtime
        env:
          MISSION_SPINE_GHCR_READ_ACTOR: ${{ secrets.MISSION_SPINE_GHCR_READ_ACTOR }}
          MISSION_SPINE_GHCR_READ_TOKEN: ${{ secrets.MISSION_SPINE_GHCR_READ_TOKEN }}
        run: |
          set -euo pipefail
          evidence_dir="$RUNNER_TEMP/rollback-migration-runtime"
          install -d -m 0700 "$evidence_dir"
          python control/scripts/release/wait_release_rollouts.py \
            --root "$GITHUB_WORKSPACE/sealed-release" \
            --gitops-root "$GITHUB_WORKSPACE/gitops-main" \
            --release-id "$RELEASE_ID" --phase migration \
            --introduced-commit "${{ steps.chain.outputs.migration_commit }}" \
            --observed-commit "${{ steps.chain.outputs.current_commit }}" \
            --evidence-out "$evidence_dir/evidence.json"
      - name: Create or reuse exact frontend-mission-off rollback
        id: rollback_off
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
          APP_ID: ${{ secrets.GITOPS_RELEASE_APP_ID }}
          APP_SLUG: ${{ steps.app_token.outputs.app-slug }}
          INSTALLATION_ID: ${{ steps.app_token.outputs.installation-id }}
          CURRENT_COMMIT: ${{ steps.chain.outputs.current_commit }}
          CURRENT_PHASE: ${{ steps.chain.outputs.phase }}
        run: |
          set -euo pipefail
          if test "$CURRENT_PHASE" = mission-on; then
            test "$(git -C gitops-main rev-parse HEAD)" = "$CURRENT_COMMIT"
            python control/scripts/release/set_web_digest.py \
              --root "$GITHUB_WORKSPACE/gitops-main" \
              --manifest-root "$GITHUB_WORKSPACE/sealed-release" \
              --release-id "$RELEASE_ID" --target mission-off \
              --expected-current mission-on
            test "$(git -C gitops-main diff --name-only)" = \
              'apps/devpath-web/base/kustomization.yaml'
            "$MISSION_SPINE_KUSTOMIZE_BIN" build gitops-main/apps/devpath-web/base >/dev/null
            git -C gitops-main config user.name 'devpath-gitops-release[bot]'
            git -C gitops-main config user.email 'devpath-gitops-release[bot]@users.noreply.github.com'
            git -C gitops-main add apps/devpath-web/base/kustomization.yaml
            git -C gitops-main commit -m "rollback(web): $RELEASE_ID frontend-mission-off"
            python control/scripts/release/verify_gitops_write_authority.py \
              --expected-app-id "$APP_ID" --app-slug "$APP_SLUG" \
              --installation-id "$INSTALLATION_ID"
            git -C gitops-main fetch --no-tags origin main:refs/remotes/origin/main
            test "$(git -C gitops-main rev-parse origin/main)" = "$CURRENT_COMMIT"
            git -C gitops-main push origin HEAD:main
            rollback_off_commit="$(git -C gitops-main rev-parse HEAD)"
            git -C gitops-main fetch --no-tags origin main:refs/remotes/origin/main
            test "$(git -C gitops-main rev-parse origin/main)" = "$rollback_off_commit"
            echo "current_commit=$rollback_off_commit" >> "$GITHUB_OUTPUT"
            echo 'current_phase=rollback-off' >> "$GITHUB_OUTPUT"
          else
            echo "current_commit=$CURRENT_COMMIT" >> "$GITHUB_OUTPUT"
            echo "current_phase=$CURRENT_PHASE" >> "$GITHUB_OUTPUT"
          fi
      - name: Require exact mission-OFF runtime before prior mutation
        if: >-
          steps.rollback_off.outputs.current_phase == 'mission-off' ||
          steps.rollback_off.outputs.current_phase == 'rollback-off'
        env:
          MISSION_SYNTHETIC_PROBE_TOKEN: ${{ secrets.MISSION_SYNTHETIC_PROBE_TOKEN }}
        run: |
          set -euo pipefail
          python control/scripts/release/wait_web_rollout.py \
            --root "$GITHUB_WORKSPACE/sealed-release" --release-id "$RELEASE_ID" \
            --environment production --phase mission-off --canary-seconds 0 \
            --commit "${{ steps.rollback_off.outputs.current_commit }}"
      - name: Create or reuse exact frontend-prior rollback
        id: rollback_prior
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
          APP_ID: ${{ secrets.GITOPS_RELEASE_APP_ID }}
          APP_SLUG: ${{ steps.app_token.outputs.app-slug }}
          INSTALLATION_ID: ${{ steps.app_token.outputs.installation-id }}
          CURRENT_COMMIT: ${{ steps.rollback_off.outputs.current_commit }}
          CURRENT_PHASE: ${{ steps.rollback_off.outputs.current_phase }}
        run: |
          set -euo pipefail
          case "$CURRENT_PHASE" in
            mission-off|rollback-off)
              test "$(git -C gitops-main rev-parse HEAD)" = "$CURRENT_COMMIT"
              python control/scripts/release/set_web_digest.py \
                --root "$GITHUB_WORKSPACE/gitops-main" \
                --manifest-root "$GITHUB_WORKSPACE/sealed-release" \
                --release-id "$RELEASE_ID" --target prior \
                --expected-current mission-off
              test "$(git -C gitops-main diff --name-only)" = \
                'apps/devpath-web/base/kustomization.yaml'
              "$MISSION_SPINE_KUSTOMIZE_BIN" build gitops-main/apps/devpath-web/base >/dev/null
              git -C gitops-main config user.name 'devpath-gitops-release[bot]'
              git -C gitops-main config user.email 'devpath-gitops-release[bot]@users.noreply.github.com'
              git -C gitops-main add apps/devpath-web/base/kustomization.yaml
              git -C gitops-main commit -m "rollback(web): $RELEASE_ID frontend-prior"
              python control/scripts/release/verify_gitops_write_authority.py \
                --expected-app-id "$APP_ID" --app-slug "$APP_SLUG" \
                --installation-id "$INSTALLATION_ID"
              git -C gitops-main fetch --no-tags origin main:refs/remotes/origin/main
              test "$(git -C gitops-main rev-parse origin/main)" = "$CURRENT_COMMIT"
              git -C gitops-main push origin HEAD:main
              prior_commit="$(git -C gitops-main rev-parse HEAD)"
              git -C gitops-main fetch --no-tags origin main:refs/remotes/origin/main
              test "$(git -C gitops-main rev-parse origin/main)" = "$prior_commit"
              ;;
            migration|services) prior_commit="$CURRENT_COMMIT" ;;
            rollback-prior) prior_commit="$CURRENT_COMMIT" ;;
            *) echo 'rollback prior cannot resume from this phase' >&2; exit 1 ;;
          esac
          echo "prior_commit=$prior_commit" >> "$GITHUB_OUTPUT"
      - name: Re-authenticate retained M/S/prior chain
        id: final_chain
        run: |
          set -euo pipefail
          git -C gitops-main fetch --no-tags origin main:refs/remotes/origin/main
          current="$(git -C gitops-main rev-parse refs/remotes/origin/main)"
          test "$current" = "${{ steps.rollback_prior.outputs.prior_commit }}"
          python control/scripts/release/verify_promotion_chain.py \
            --root "$GITHUB_WORKSPACE/gitops-main" \
            --release-root "$GITHUB_WORKSPACE/sealed-release" \
            --release-id "$RELEASE_ID" --current "$current" \
            --github-output "$GITHUB_OUTPUT" >/dev/null
          phase="$(sed -n 's/^phase=//p' "$GITHUB_OUTPUT" | tail -1)"
          web_phase="$(sed -n 's/^web_phase=//p' "$GITHUB_OUTPUT" | tail -1)"
          case "$phase:$web_phase" in
            migration:base|services:base|services:prior|rollback-prior:prior) ;;
            *) echo 'rollback did not retain an exact migration/services prior phase' >&2; exit 1 ;;
          esac
      - name: Re-observe retained all-nine service runtime
        if: steps.final_chain.outputs.services_commit != ''
        env:
          MISSION_SPINE_GHCR_READ_ACTOR: ${{ secrets.MISSION_SPINE_GHCR_READ_ACTOR }}
          MISSION_SPINE_GHCR_READ_TOKEN: ${{ secrets.MISSION_SPINE_GHCR_READ_TOKEN }}
          SERVICES_COMMIT: ${{ steps.final_chain.outputs.services_commit }}
        run: |
          set -euo pipefail
          evidence_dir="$RUNNER_TEMP/rollback-services-runtime"
          install -d -m 0700 "$evidence_dir"
          python control/scripts/release/wait_release_rollouts.py \
            --root "$GITHUB_WORKSPACE/sealed-release" \
            --gitops-root "$GITHUB_WORKSPACE/gitops-main" \
            --release-id "$RELEASE_ID" --phase services \
            --introduced-commit "$SERVICES_COMMIT" \
            --observed-commit "${{ steps.final_chain.outputs.current_commit }}" \
            --evidence-out "$evidence_dir/evidence.json"
      - name: Require exact prior web runtime
        env:
          MISSION_SYNTHETIC_PROBE_TOKEN: ${{ secrets.MISSION_SYNTHETIC_PROBE_TOKEN }}
        run: |
          set -euo pipefail
          python control/scripts/release/wait_web_rollout.py \
            --root "$GITHUB_WORKSPACE/sealed-release" --release-id "$RELEASE_ID" \
            --environment production --phase prior --canary-seconds 0 \
            --commit "${{ steps.rollback_prior.outputs.prior_commit }}"
      - name: Recheck Landing prior CAS after web rollback
        id: rollback_complete
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          python control/scripts/release/cloudflare_pages.py \
            --root "$GITHUB_WORKSPACE/sealed-release" --release-id "$RELEASE_ID" \
            --action verify-prior
          elapsed=$(( $(date +%s) - ROLLBACK_STARTED ))
          test "$elapsed" -le 600
          echo "rollback_seconds=$elapsed" >> "$GITHUB_OUTPUT"
      - name: Record sanitized rollback evidence
        env:
          CANDIDATE_SHA: ${{ steps.release.outputs.candidate_spec_sha256 }}
          ROLLBACK_SECONDS: ${{ steps.rollback_complete.outputs.rollback_seconds }}
          PRIOR_COMMIT: ${{ steps.rollback_prior.outputs.prior_commit }}
          RETAINED_SERVICES_COMMIT: ${{ steps.final_chain.outputs.services_commit }}
          FINAL_PHASE: ${{ steps.final_chain.outputs.phase }}
        run: |
          set -euo pipefail
          install -d -m 0700 "$RUNNER_TEMP/rollback-evidence"
          retained_services=false
          if test -n "$RETAINED_SERVICES_COMMIT"; then retained_services=true; fi
          printf '{"candidate_spec_sha256":"%s","status":"passed","rollback_seconds":%s,"landing-prior":true,"frontend-mission-off":true,"frontend-prior":true,"retain-additive-services-and-schema":%s,"retained_services_commit":"%s","prior_commit":"%s","producer_run_id":%s,"producer_run_attempt":1}\n' \
            "$CANDIDATE_SHA" "$ROLLBACK_SECONDS" "$retained_services" \
            "$RETAINED_SERVICES_COMMIT" "$PRIOR_COMMIT" "$GITHUB_RUN_ID" \
            > "$RUNNER_TEMP/rollback-evidence/evidence.json"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ${{ inputs.release_id }}-reverse-rollback-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/rollback-evidence/evidence.json
          if-no-files-found: error
          retention-days: 30
          overwrite: false
          include-hidden-files: false
      - name: Remove the exact production kubeconfig
        if: always()
        run: |
          set -euo pipefail
          python control/scripts/release/manage_production_kubeconfig.py cleanup \
            --runner-temp "$RUNNER_TEMP" --path "${KUBECONFIG:-}"

  rebaseline_staging:
    name: Rebaseline staging to rolled-back exact prior
    needs: [reverse-rollback]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: mission-spine-staging
    concurrency:
      group: mission-spine-staging
      queue: max
      cancel-in-progress: false
    permissions:
      actions: read
      contents: read
      deployments: read
    steps:
      - name: Checkout original protected-main workflow bytes
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
          path: control
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
      - name: Checkout sealed release branch as data only
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: release/candidate-${{ inputs.release_id }}
          fetch-depth: 0
          persist-credentials: false
          path: sealed-release
      - name: Checkout the rolled-back current main as data only
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
          path: gitops-main
      - name: Authenticate exact post-rollback context before staging approval
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python control/scripts/release/verify_post_promotion_staging_context.py \
            --control-root "$GITHUB_WORKSPACE/control" \
            --gitops-root "$GITHUB_WORKSPACE/gitops-main" \
            --data-root "$GITHUB_WORKSPACE/sealed-release" \
            --workflow-path .github/workflows/mission-spine-rollback.yml \
            --release-id "$RELEASE_ID" \
            --expected-commit "${{ needs['reverse-rollback'].outputs.prior_commit }}" \
            --expected-phase prior
      - name: Authenticate this attempt-one protected staging approval
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python control/scripts/release/verify_current_protected_approval.py \
            --environment mission-spine-staging \
            --job-name 'Rebaseline staging to rolled-back exact prior' \
            --workflow-path .github/workflows/mission-spine-rollback.yml
      - uses: azure/setup-kubectl@829323503d1be3d00ca8346e5391ca0b07a9ab0d # v5.1.0
        with:
          version: v1.36.2
      - name: Configure approved staging cluster
        id: kube
        env:
          STAGING_KUBECONFIG_B64: ${{ secrets.STAGING_KUBECONFIG_B64 }}
        run: |
          set -euo pipefail
          python control/scripts/release/verify_post_promotion_staging_context.py \
            --control-root "$GITHUB_WORKSPACE/control" \
            --gitops-root "$GITHUB_WORKSPACE/gitops-main" \
            --data-root "$GITHUB_WORKSPACE/sealed-release" \
            --workflow-path .github/workflows/mission-spine-rollback.yml \
            --release-id "$RELEASE_ID" \
            --expected-commit "${{ needs['reverse-rollback'].outputs.prior_commit }}" \
            --expected-phase prior
          test -n "${STAGING_KUBECONFIG_B64:-}"
          python control/scripts/release/manage_production_kubeconfig.py create \
            --scope staging --runner-temp "$RUNNER_TEMP" --github-env "$GITHUB_ENV"
      - name: Rebaseline staging to the exact rolled-back prior lineage
        id: rebaseline
        env:
          MISSION_SYNTHETIC_PROBE_TOKEN: ${{ secrets.MISSION_SYNTHETIC_PROBE_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${MISSION_SYNTHETIC_PROBE_TOKEN:-}"
          python control/scripts/release/stage_web_release.py \
            --root "$GITHUB_WORKSPACE/sealed-release" --release-id "$RELEASE_ID" \
            --phase prior --expected-current candidate
          python control/scripts/release/wait_web_rollout.py \
            --root "$GITHUB_WORKSPACE/sealed-release" --release-id "$RELEASE_ID" \
            --environment staging --phase prior --canary-seconds 0
      - name: Fail-safe retain staging prior after an incomplete rebaseline
        if: failure() && steps.kube.outcome == 'success'
        env:
          MISSION_SYNTHETIC_PROBE_TOKEN: ${{ secrets.MISSION_SYNTHETIC_PROBE_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${MISSION_SYNTHETIC_PROBE_TOKEN:-}"
          python control/scripts/release/stage_web_release.py \
            --root "$GITHUB_WORKSPACE/sealed-release" --release-id "$RELEASE_ID" \
            --phase prior --expected-current candidate
          python control/scripts/release/wait_web_rollout.py \
            --root "$GITHUB_WORKSPACE/sealed-release" --release-id "$RELEASE_ID" \
            --environment staging --phase prior --canary-seconds 0
      - name: Remove the exact staging kubeconfig
        if: always()
        run: |
          set -euo pipefail
          python control/scripts/release/manage_production_kubeconfig.py cleanup \
            --runner-temp "$RUNNER_TEMP" --path "${KUBECONFIG:-}"

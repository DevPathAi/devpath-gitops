apiVersion: apps/v1
kind: Deployment
metadata:
  name: devpath-notification-svc
  labels:
    app: devpath-notification-svc
spec:
  replicas: 1
  selector:
    matchLabels:
      app: devpath-notification-svc
  template:
    metadata:
      labels:
        app: devpath-notification-svc
    spec:
      enableServiceLinks: false
      containers:
        - name: devpath-notification-svc
          # 이미지 태그는 ArgoCD Image Updater 또는 CI가 교체한다.
          image: ghcr.io/devpathai/devpath-notification-svc:main
          ports:
            - containerPort: 8080
          env:
            - name: DB_URL
              valueFrom:
                secretKeyRef:
                  name: platform-db
                  key: db-url
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: platform-db
                  key: db-user
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: platform-db
                  key: db-password
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: devpath-jwt
                  key: jwt-secret
            - name: KAFKA_BOOTSTRAP
              value: "devpath-kafka-bootstrap.kafka.svc:9092"
            - name: SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE
              value: "5"
            - name: AI_SVC_URI
              value: "http://devpath-ai-svc.devpath.svc:8080"
            # 초대 메일은 mock이 아닌 실제 SMTP로만 운영한다. 자격증명 Secret이 없으면
            # pod를 띄우지 않아 성공으로 보이는 무발송 상태를 막는다.
            - name: MAIL_PROVIDER
              value: "smtp"
            - name: MAIL_HOST
              valueFrom:
                secretKeyRef:
                  name: notification-mail
                  key: host
            - name: MAIL_PORT
              valueFrom:
                secretKeyRef:
                  name: notification-mail
                  key: port
            - name: MAIL_USERNAME
              valueFrom:
                secretKeyRef:
                  name: notification-mail
                  key: username
            - name: MAIL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: notification-mail
                  key: password
            - name: MAIL_FROM
              value: "no-reply@leva.ai.kr"
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi

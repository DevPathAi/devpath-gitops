apiVersion: apps/v1
kind: Deployment
metadata:
  name: devpath-notification-svc
  labels:
    app: devpath-notification-svc
spec:
  replicas: 1
  selector:
    matchLabels:
      app: devpath-notification-svc
  template:
    metadata:
      labels:
        app: devpath-notification-svc
    spec:
      enableServiceLinks: false
      containers:
        - name: devpath-notification-svc
          # 이미지 태그는 ArgoCD Image Updater 또는 CI가 교체한다.
          image: ghcr.io/devpathai/devpath-notification-svc:main
          ports:
            - containerPort: 8080
          env:
            - name: DB_URL
              valueFrom:
                secretKeyRef:
                  name: platform-db
                  key: db-url
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: platform-db
                  key: db-user
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: platform-db
                  key: db-password
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: devpath-jwt
                  key: jwt-secret
            - name: KAFKA_BOOTSTRAP
              value: "devpath-kafka-bootstrap.kafka.svc:9092"
            - name: AI_SVC_URI
              value: "http://devpath-ai-svc.devpath.svc:8080"
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi

apiVersion: apps/v1
kind: Deployment
metadata:
  name: devpath-sandbox-svc
  labels:
    app: devpath-sandbox-svc
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: devpath-sandbox-svc
  template:
    metadata:
      labels:
        app: devpath-sandbox-svc
    spec:
      enableServiceLinks: false
      terminationGracePeriodSeconds: 120
      containers:
        - name: devpath-sandbox-svc
          # 이미지 태그는 ArgoCD Image Updater 또는 CI가 교체한다.
          image: ghcr.io/devpathai/devpath-sandbox-svc:main
          ports:
            - containerPort: 8080
          env:
            - name: DB_URL
              valueFrom:
                secretKeyRef:
                  name: platform-db
                  key: db-url
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: platform-db
                  key: db-user
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: platform-db
                  key: db-password
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: devpath-jwt
                  key: jwt-secret
            - name: KAFKA_BOOTSTRAP
              value: "devpath-kafka-bootstrap.kafka.svc:9092"
            - name: SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE
              value: "5"
            - name: INTERNAL_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: devpath-internal-auth
                  key: sandbox-token
            - name: DOCKER_HOST
              value: "tcp://devpath-sandbox-runner:2376"
            - name: DOCKER_CERT_PATH
              value: "/var/run/secrets/sandbox-runner-tls"
            - name: SANDBOX_RUNNER_TLS_VERIFY
              value: "true"
            - name: SANDBOX_RUNTIME
              value: "runsc"
            - name: SANDBOX_REQUIRE_ISOLATION
              value: "true"
            - name: SANDBOX_DRAIN_TIMEOUT_MS
              value: "75000"
            - name: SANDBOX_ACTIVE_CUTOFF_MS
              value: "60000"
            - name: SPRING_LIFECYCLE_TIMEOUT_PER_SHUTDOWN_PHASE
              value: "90s"
            - name: SANDBOX_LEASE_DURATION_MS
              value: "20000"
            - name: SANDBOX_LEASE_HEARTBEAT_MS
              value: "5000"
          volumeMounts:
            - name: sandbox-runner-mtls
              mountPath: /var/run/secrets/sandbox-runner-tls
              readOnly: true
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
      volumes:
        - name: sandbox-runner-mtls
          secret:
            secretName: sandbox-runner-mtls
            defaultMode: 256

apiVersion: apps/v1
kind: Deployment
metadata:
  name: devpath-ai-svc
  labels:
    app: devpath-ai-svc
spec:
  replicas: 1
  selector:
    matchLabels:
      app: devpath-ai-svc
  template:
    metadata:
      labels:
        app: devpath-ai-svc
    spec:
      # K8s service link env 자동주입 차단 (redis Service가 REDIS_PORT=tcp://... 주입 → Spring int 변환 붕괴)
      enableServiceLinks: false
      containers:
        - name: devpath-ai-svc
          # 이미지 태그는 ArgoCD Image Updater 또는 CI가 교체한다.
          image: ghcr.io/devpathai/devpath-ai-svc:main
          ports:
            - containerPort: 8080
          env:
            - name: DB_URL
              valueFrom:
                secretKeyRef:
                  name: platform-db
                  key: db-url
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: platform-db
                  key: db-user
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: platform-db
                  key: db-password
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: devpath-jwt
                  key: jwt-secret
            - name: KAFKA_BOOTSTRAP
              value: "devpath-kafka-bootstrap.kafka.svc:9092"
            - name: SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE
              value: "5"
            - name: SANDBOX_URI
              value: "http://devpath-sandbox-svc.devpath.svc:8080"
            - name: LCS_URI
              value: "http://devpath-lcs-svc.devpath.svc:8080"
            - name: INTERNAL_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: devpath-internal-auth
                  key: sandbox-token
            - name: LEARNING_URI
              value: "http://devpath-learning-svc.devpath.svc:8080"
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: ai-claude
                  key: anthropic-api-key
            - name: REVIEW_PROVIDER
              value: "claude"
            # 멘토는 Ollama 우선 — Anthropic 크레딧 소진 시 멘토 전체가 멈추는 것을 막는다.
            # claude 는 폴백으로 남겨 크레딧이 복구되면 품질 좋은 쪽이 자동으로 다시 쓰인다.
            - name: MENTOR_PROVIDER
              value: "ollama"
            - name: MENTOR_FALLBACK
              value: "claude"
            - name: MENTOR_OLLAMA_MODEL
              value: "qwen2.5:3b"
            - name: MENTOR_CLAUDE_MODEL
              value: "claude-sonnet-4-6"
            - name: COMMUNITY_SEED_PROVIDER
              value: "claude"
            - name: RETENTION_PROVIDER
              value: "claude"
            # Claude 가 막히면(429·5xx·401) 세 기능 모두 GPU 노드의 Ollama(qwen2.5:7b)가 이어받는다.
            #
            # 2026-10-01 에는 CPU Ollama(qwen2.5:3b)로 재서 retention 만 켰다. 그 판정을 2026-10-02
            # GPU 노드(L4, qwen2.5:7b) 실측이 뒤집었다 — 각 기능의 실제 system/user 프롬프트·options·
            # format 을 그대로 재구성해 /api/chat 으로 측정:
            #   기능             3b @ CPU(어제)                → 7b @ GPU(실측)
            #   retention        콜드 30.4초 · 웜 16.6초         → 콜드 24.8초 · 웜 0.8초
            #   community-seed   29.5초, 질문에 되물음 ❌        → 7.3초, 정답 제시 ✅
            #   review           콜드 70.6초(초과) · 영어 ❌     → 웜 5.6초, 한국어 JSON, SQL 인젝션 정확 ✅
            # 생성 속도 4.9 → 약 52 tok/s. 최악(콜드 24.8초 + 가장 긴 생성 약 10초)도 타임아웃 60초 안이다.
            #
            # ★어제 주석의 「7b 를 막는 것은 메모리」는 CPU 노드(t3.xlarge 가용 3.7GB)의 사실이고,
            # GPU 노드에는 해당하지 않는다★ — 파드 limit 8Gi 안에서 3b+7b 가 공존해 cgroup
            # memory.current 4.79GB(56%), 압박 0회(memory.events max=0). 단 모델을 셋 이상 올리면
            # page cache 가 limit 을 채워 로드가 105초까지 늘어진다(실측) → 아래 모델은 2종까지만.
            #
            # ★GPU 는 스팟이라 회수되면 이 폴백이 함께 사라진다 — 사용자 결정(2026-10-02)으로 수용했다★
            # 근거: 폴백은 Claude 가 이미 실패한 2차 경로다. GPU 상실 = 「Claude 실패 시 대체 없음」 =
            # PR #83 이전 상태로 돌아갈 뿐이어서 순손실이 아니다. 회수 자체는 EventBridge →
            # SNS(이메일·Slack) 통지로 보완한다(런북 「스팟 회수 후 복구」).
            # 재참여 문구는 휘발성이고 호출측(notification-svc)에 고정 폴백 문구가 이미 있어
            # 폴백이 또 실패해도 최악이 현상 유지다.
            - name: RETENTION_FALLBACK
              value: "ollama"
            - name: COMMUNITY_SEED_FALLBACK
              value: "ollama"
            - name: REVIEW_FALLBACK
              value: "ollama"
            # 세 기능 모두 qwen2.5:7b 하나를 공유한다 — 모델 수를 2종(path 생성용 3b + 폴백용 7b)으로
            # 묶어야 위 메모리·디스크 한계 안에 들어간다. 생략하면 코드 기본값으로 떨어지는데
            # review 는 qwen2.5-coder:7b 라 3종이 되고, retention·community-seed 는 GPU 노드에
            # 받아 둔 적 없는 태그를 불러 「model not found」404 가 된다.
            # coder:7b 는 review 품질이 조금 더 간결했지만(실측) 3종이 되어 쓰지 않는다.
            - name: RETENTION_OLLAMA_MODEL
              value: "qwen2.5:7b"
            - name: COMMUNITY_SEED_OLLAMA_MODEL
              value: "qwen2.5:7b"
            - name: REVIEW_OLLAMA_MODEL
              value: "qwen2.5:7b"
            # 폴백만 GPU 로 보낸다. 임베딩·멘토는 아래 공용 OLLAMA_BASE_URL(CPU 노드)에 그대로 남는다 —
            # 임베딩에는 폴백이 없어 스팟 회수에 노출시킬 수 없고, 멘토는 MENTOR_FALLBACK=claude 가 받는다.
            # 이 키들을 ai-svc application.yml 에 등록하지 않으면 조용히 무시된다(OLLAMA_PATH_* 가
            # 그래서 8.1초에 503 으로 떨어졌던 2026-08-17 실측과 같은 실패 양식).
            - name: RETENTION_OLLAMA_BASE_URL
              value: "http://ollama-gpu.devpath.svc:11434"
            - name: COMMUNITY_SEED_OLLAMA_BASE_URL
              value: "http://ollama-gpu.devpath.svc:11434"
            - name: REVIEW_OLLAMA_BASE_URL
              value: "http://ollama-gpu.devpath.svc:11434"
            # 클러스터 내 Ollama 게이트웨이 — path 생성·임베딩 라우팅(코드 기본 localhost:11434는 파드 내 없음)
            - name: OLLAMA_BASE_URL
              value: "http://ollama.devpath.svc:11434"
            - name: OLLAMA_GEN_MODEL
              value: "qwen2.5:3b"
            # 학습경로 생성만 GPU 노드의 Ollama 로 보낸다. 임베딩·멘토·리뷰는 위의 CPU Ollama 에 남는다.
            # GPU 노드는 스팟이라 회수될 수 있는데, 그때 멈추는 것은 학습경로뿐이고 그건 비동기 작업이다.
            - name: OLLAMA_PATH_BASE_URL
              value: "http://ollama-gpu.devpath.svc:11434"
            # 코드 기본 PT8S 는 embed(2초)에 맞춘 값이라 생성에는 매번 끊긴다. GPU 에서 생성은 30~60초다.
            # 주의: OllamaClient.generatePath 는 계약 위반 시 1회 재시도하므로 최악 2배까지 걸린다.
            # OLLAMA_TIMEOUT 은 건드리지 않는다 — 그 값을 올리면 2초짜리 임베딩까지 함께 늘어난다.
            - name: OLLAMA_PATH_TIMEOUT
              value: "PT300S"
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi

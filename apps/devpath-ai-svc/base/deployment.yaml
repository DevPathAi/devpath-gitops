apiVersion: apps/v1
kind: Deployment
metadata:
  name: devpath-ai-svc
  labels:
    app: devpath-ai-svc
spec:
  replicas: 1
  selector:
    matchLabels:
      app: devpath-ai-svc
  template:
    metadata:
      labels:
        app: devpath-ai-svc
    spec:
      # K8s service link env 자동주입 차단 (redis Service가 REDIS_PORT=tcp://... 주입 → Spring int 변환 붕괴)
      enableServiceLinks: false
      containers:
        - name: devpath-ai-svc
          # 이미지 태그는 ArgoCD Image Updater 또는 CI가 교체한다.
          image: ghcr.io/devpathai/devpath-ai-svc:main
          ports:
            - containerPort: 8080
          env:
            - name: DB_URL
              valueFrom:
                secretKeyRef:
                  name: platform-db
                  key: db-url
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: platform-db
                  key: db-user
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: platform-db
                  key: db-password
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: devpath-jwt
                  key: jwt-secret
            - name: KAFKA_BOOTSTRAP
              value: "devpath-kafka-bootstrap.kafka.svc:9092"
            - name: SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE
              value: "5"
            - name: SANDBOX_URI
              value: "http://devpath-sandbox-svc.devpath.svc:8080"
            - name: LCS_URI
              value: "http://devpath-lcs-svc.devpath.svc:8080"
            - name: INTERNAL_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: devpath-internal-auth
                  key: sandbox-token
            - name: LEARNING_URI
              value: "http://devpath-learning-svc.devpath.svc:8080"
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: ai-claude
                  key: anthropic-api-key
            - name: REVIEW_PROVIDER
              value: "claude"
            # 멘토는 Ollama 우선 — Anthropic 크레딧 소진 시 멘토 전체가 멈추는 것을 막는다.
            # claude 는 폴백으로 남겨 크레딧이 복구되면 품질 좋은 쪽이 자동으로 다시 쓰인다.
            - name: MENTOR_PROVIDER
              value: "ollama"
            - name: MENTOR_FALLBACK
              value: "claude"
            - name: MENTOR_OLLAMA_MODEL
              value: "qwen2.5:3b"
            - name: MENTOR_CLAUDE_MODEL
              value: "claude-sonnet-4-6"
            - name: COMMUNITY_SEED_PROVIDER
              value: "claude"
            - name: RETENTION_PROVIDER
              value: "claude"
            # Claude 가 막히면(429·5xx·401) 재참여 문구를 CPU Ollama 가 이어받는다.
            # 세 기능 중 retention 만 켠다 — 2026-10-01 운영 CPU Ollama(qwen2.5:3b) 실측:
            #   retention       콜드 30.4초 · 웜 16.6초, 한국어 문구 정상        → 타임아웃(60초) 안
            #   community-seed  29.5초인데 질문에 답하지 않고 되물었다            → 공개 게시물이라 불가
            #   review          콜드 70.6초로 타임아웃 초과 + 한국어 지시에 영어 출력 → 불가
            # 뒤의 둘은 저장·공개되는 산출물이라 스펙 §4.1 의 「가짜 산출물이 사용자 기록에
            # 영구히 남는 것은 실패보다 나쁘다」에 걸린다. 7b 는 노드 메모리가 막는다
            # (t3.xlarge 가용 3.7GB, q4 7b 는 약 5GB 필요 — 디스크가 아니라 메모리가 한계).
            #
            # 재참여 문구는 휘발성이고 호출측(notification-svc)에 이미 고정 폴백 문구가 있어,
            # 폴백이 또 실패해도 최악이 현상 유지다 — 상방만 있는 변경이다.
            # GPU Ollama 로 보내지 않는다: 그쪽은 스팟 노드라 회수될 수 있고, 그때 멈추는 것은
            # 비동기인 학습경로 생성뿐이어야 한다(위 OLLAMA_PATH_BASE_URL 주석과 같은 원칙).
            - name: RETENTION_FALLBACK
              value: "ollama"
            # 코드 기본값은 qwen2.5:7b 인데 CPU Ollama 에 받아 둔 것은 3b 뿐이다.
            # 명시하지 않으면 폴백이 「model not found」404 로 떨어진다.
            - name: RETENTION_OLLAMA_MODEL
              value: "qwen2.5:3b"
            # 클러스터 내 Ollama 게이트웨이 — path 생성·임베딩 라우팅(코드 기본 localhost:11434는 파드 내 없음)
            - name: OLLAMA_BASE_URL
              value: "http://ollama.devpath.svc:11434"
            - name: OLLAMA_GEN_MODEL
              value: "qwen2.5:3b"
            # 학습경로 생성만 GPU 노드의 Ollama 로 보낸다. 임베딩·멘토·리뷰는 위의 CPU Ollama 에 남는다.
            # GPU 노드는 스팟이라 회수될 수 있는데, 그때 멈추는 것은 학습경로뿐이고 그건 비동기 작업이다.
            - name: OLLAMA_PATH_BASE_URL
              value: "http://ollama-gpu.devpath.svc:11434"
            # 코드 기본 PT8S 는 embed(2초)에 맞춘 값이라 생성에는 매번 끊긴다. GPU 에서 생성은 30~60초다.
            # 주의: OllamaClient.generatePath 는 계약 위반 시 1회 재시도하므로 최악 2배까지 걸린다.
            # OLLAMA_TIMEOUT 은 건드리지 않는다 — 그 값을 올리면 2초짜리 임베딩까지 함께 늘어난다.
            - name: OLLAMA_PATH_TIMEOUT
              value: "PT300S"
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi

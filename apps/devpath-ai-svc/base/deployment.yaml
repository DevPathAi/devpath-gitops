apiVersion: apps/v1
kind: Deployment
metadata:
  name: devpath-ai-svc
  labels:
    app: devpath-ai-svc
spec:
  replicas: 1
  selector:
    matchLabels:
      app: devpath-ai-svc
  template:
    metadata:
      labels:
        app: devpath-ai-svc
    spec:
      # K8s service link env 자동주입 차단 (redis Service가 REDIS_PORT=tcp://... 주입 → Spring int 변환 붕괴)
      enableServiceLinks: false
      containers:
        - name: devpath-ai-svc
          # 이미지 태그는 ArgoCD Image Updater 또는 CI가 교체한다.
          image: ghcr.io/devpathai/devpath-ai-svc:main
          ports:
            - containerPort: 8080
          env:
            - name: DB_URL
              valueFrom:
                secretKeyRef:
                  name: platform-db
                  key: db-url
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: platform-db
                  key: db-user
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: platform-db
                  key: db-password
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: devpath-jwt
                  key: jwt-secret
            - name: KAFKA_BOOTSTRAP
              value: "devpath-kafka-bootstrap.kafka.svc:9092"
            - name: SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE
              value: "5"
            - name: SANDBOX_URI
              value: "http://devpath-sandbox-svc.devpath.svc:8080"
            - name: LCS_URI
              value: "http://devpath-lcs-svc.devpath.svc:8080"
            - name: INTERNAL_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: devpath-internal-auth
                  key: sandbox-token
            - name: LEARNING_URI
              value: "http://devpath-learning-svc.devpath.svc:8080"
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: ai-claude
                  key: anthropic-api-key
            - name: REVIEW_PROVIDER
              value: "claude"
            - name: MENTOR_PROVIDER
              value: "ollama"
            - name: MENTOR_FALLBACK
              value: "claude"
            - name: MENTOR_OLLAMA_MODEL
              value: "qwen2.5:3b"
            - name: MENTOR_CLAUDE_MODEL
              value: "claude-sonnet-4-6"
            - name: COMMUNITY_SEED_PROVIDER
              value: "claude"
            - name: RETENTION_PROVIDER
              value: "claude"
            # 클러스터 내 Ollama 게이트웨이 — path 생성·임베딩 라우팅(코드 기본 localhost:11434는 파드 내 없음)
            - name: OLLAMA_BASE_URL
              value: "http://ollama.devpath.svc:11434"
            - name: OLLAMA_GEN_MODEL
              value: "qwen2.5:3b"
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi

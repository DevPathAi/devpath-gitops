apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama-gpu
  labels:
    app: ollama-gpu
spec:
  replicas: 1
  # ★RollingUpdate 로는 이 Deployment 를 재시작할 수 없다(2026-10-02 실측)★ — 노드의
  # nvidia.com/gpu 가 1 개뿐이라 새 파드는 옛 파드가 GPU 를 놓을 때까지 Unschedulable
  # (`Insufficient nvidia.com/gpu`)이고, 롤아웃은 그 새 파드를 기다리므로 옛 파드를 끝내지 않는다.
  # `kubectl rollout restart` 가 영구 교착에 빠졌고 `rollout undo` 로 풀어야 했다.
  # Recreate 면 옛 파드를 먼저 끝내고 GPU 를 반납한 뒤 새 파드를 만든다. 단일 레플리카라
  # 무중단이 애초에 불가능하므로 잃는 것도 없다.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ollama-gpu
  template:
    metadata:
      labels:
        app: ollama-gpu
    spec:
      # 학습경로 생성 + review·community-seed·retention 의 Claude 폴백을 맡는다.
      # 임베딩과 멘토는 CPU 노드의 devpath-ollama 에 남는다 — 임베딩에는 폴백이 아예 없어
      # 스팟 회수에 노출시킬 수 없고, 멘토는 MENTOR_FALLBACK=claude 가 받아 준다.
      #
      # 이 노드는 스팟이라 회수될 수 있다. 그때 멈추는 것은
      #   · 학습경로 생성 — 비동기라 재시도로 흡수된다.
      #   · 세 기능의 Claude 폴백 — 폴백은 Claude 가 이미 실패한 2차 경로이므로, 상실해도
      #     「Claude 실패 시 대체 없음」(= 폴백 도입 이전 상태)으로 돌아갈 뿐 순손실이 아니다.
      # 2026-10-02 사용자 결정으로 이 교환을 수용했다(품질·지연 이득이 가용성 손실보다 크다):
      # CPU 3b 로는 retention 하나만 겨우 됐는데(콜드 30.4초) GPU 7b 는 세 기능 전부가
      # 타임아웃 안에 들고 한국어 품질도 정상이다. 회수 통지는 EventBridge → SNS 로 붙였다.
      nodeSelector:
        devpath.ai/gpu: "true"
      # GPU 노드에는 devpath.ai/gpu=true:NoSchedule 테인트를 건다. 그러지 않으면 기존 서비스 파드가
      # 재시작될 때 스팟 노드로 흘러들어가, 회수 시 관계없는 서비스까지 같이 내려간다.
      tolerations:
        - key: devpath.ai/gpu
          operator: Equal
          value: "true"
          effect: NoSchedule
      # k3s 가 nvidia-container-runtime 을 감지하면 등록하는 RuntimeClass.
      runtimeClassName: nvidia
      containers:
        - name: ollama
          image: ollama/ollama:0.32.5
          ports:
            - containerPort: 11434
          env:
            # Ollama는 기본 127.0.0.1에만 바인딩 → 파드 간 접근 위해 0.0.0.0 필수
            - name: OLLAMA_HOST
              value: "0.0.0.0:11434"
            # 모델을 메모리에 붙잡아 둔다. 학습경로는 드문드문 호출되는데 매번 로드하면
            # 첫 요청이 모델 로드까지 떠안는다.
            - name: OLLAMA_KEEP_ALIVE
              value: "24h"
          volumeMounts:
            - name: models
              mountPath: /root/.ollama
          lifecycle:
            postStart:
              exec:
                # 백그라운드(&) pull — 컨테이너 시작을 막지 않음(pull 실패로 인한 SIGKILL 회피).
                # 생성 모델만 받는다. 임베딩 모델은 CPU 쪽에 있다.
                #   qwen2.5:3b — 학습경로 생성(OLLAMA_PATH_BASE_URL)
                #   qwen2.5:7b — review·community-seed·retention 의 Claude 폴백(2026-10-02 실측으로 채택)
                # ★이 둘까지만 받는다★ — 파드 limit 8Gi 안에서 두 모델은 공존하지만(실측
                # memory.current 4.79GB, 압박 0회) 셋째를 올리면 page cache 가 limit 을 채워
                # 모델 로드가 105초까지 늘어진다. 디스크도 AMI·드라이버가 차지해 9.4GB 여유뿐이다.
                command:
                  - /bin/sh
                  - -c
                  - "(until ollama list >/dev/null 2>&1; do sleep 2; done; ollama pull qwen2.5:3b; ollama pull qwen2.5:7b) &"
          readinessProbe:
            httpGet:
              path: /api/tags
              port: 11434
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 250m
              memory: 2Gi
            limits:
              memory: 8Gi
              nvidia.com/gpu: 1
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: ollama-gpu-models

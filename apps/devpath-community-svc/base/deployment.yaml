apiVersion: apps/v1
kind: Deployment
metadata:
  name: devpath-community-svc
  labels:
    app: devpath-community-svc
spec:
  replicas: 1
  selector:
    matchLabels:
      app: devpath-community-svc
  template:
    metadata:
      labels:
        app: devpath-community-svc
    spec:
      enableServiceLinks: false
      containers:
        - name: devpath-community-svc
          # 이미지 태그는 ArgoCD Image Updater 또는 CI가 교체한다.
          image: ghcr.io/devpathai/devpath-community-svc:main
          ports:
            - containerPort: 8080
          env:
            - name: DB_URL
              valueFrom:
                secretKeyRef:
                  name: platform-db
                  key: db-url
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: platform-db
                  key: db-user
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: platform-db
                  key: db-password
            - name: DEVPATH_AUTH_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: devpath-jwt
                  key: jwt-secret
            - name: KAFKA_BOOTSTRAP
              value: "devpath-kafka-bootstrap.kafka.svc:9092"
            - name: SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE
              value: "5"
            - name: AI_SVC_URI
              value: "http://devpath-ai-svc.devpath.svc:8080"
            # 커뮤니티 검색 인덱스. ES 가 없거나 죽어 있어도 앱은 기동하고 목록·글쓰기는
            # 계속 동작한다(검색만 실패). 키 이름은 application.yml 의 ${ES_URIS} 와 일치.
            - name: ES_URIS
              value: "http://elasticsearch.devpath.svc:9200"
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi

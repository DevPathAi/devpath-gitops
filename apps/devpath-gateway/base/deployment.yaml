apiVersion: apps/v1
kind: Deployment
metadata:
  name: devpath-gateway
  labels:
    app: devpath-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: devpath-gateway
  template:
    metadata:
      labels:
        app: devpath-gateway
    spec:
      enableServiceLinks: false
      containers:
        - name: devpath-gateway
          # 이미지 태그는 ArgoCD Image Updater 또는 CI가 교체한다.
          image: ghcr.io/devpathai/devpath-gateway:main
          ports:
            - containerPort: 8080
          env:
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: devpath-jwt
                  key: jwt-secret
            # 원 Host(api.leva.ai.kr)를 다운스트림에 보존 + X-Forwarded 전파 — platform이
            # 프록시 뒤에서 OAuth redirect_uri baseUrl을 올바르게 생성하기 위함
            - name: SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_DEFAULT_FILTERS_0
              value: "PreserveHostHeader"
            # SCG의 X-Forwarded 재작성을 끔 — Traefik이 넣은 원본(X-Forwarded-Proto=https 등)이
            # 그대로 platform에 전달되어야 baseUrl 스킴이 https로 생성됨
            - name: SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_XFORWARDED_ENABLED
              value: "false"
            # SCG 신버전은 trusted-proxies 미설정 시 수신 X-Forwarded/Forwarded를 제거 —
            # Traefik(pod CIDR 10.42.0.0/16)을 신뢰해 원본 헤더를 통과시킴
            - name: SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_TRUSTED_PROXIES
              value: "10\\..*|127\\.0\\.0\\.1"
            - name: CORS_ALLOWED_ORIGINS
              value: "https://leva.ai.kr,https://app.leva.ai.kr,https://admin.leva.ai.kr"
            - name: PLATFORM_URI
              value: "http://devpath-platform-svc.devpath.svc:8080"
            - name: LEARNING_URI
              value: "http://devpath-learning-svc.devpath.svc:8080"
            - name: SANDBOX_URI
              value: "http://devpath-sandbox-svc.devpath.svc:8080"
            - name: AI_SVC_URI
              value: "http://devpath-ai-svc.devpath.svc:8080"
            - name: COMMUNITY_SVC_URI
              value: "http://devpath-community-svc.devpath.svc:8080"
            - name: NOTIFICATION_URI
              value: "http://devpath-notification-svc.devpath.svc:8080"
            - name: LCS_SVC_URI
              value: "http://devpath-lcs-svc.devpath.svc:8080"
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi

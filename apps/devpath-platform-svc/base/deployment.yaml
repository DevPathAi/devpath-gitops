apiVersion: apps/v1
kind: Deployment
metadata:
  name: devpath-platform-svc
  labels:
    app: devpath-platform-svc
spec:
  replicas: 1
  selector:
    matchLabels:
      app: devpath-platform-svc
  template:
    metadata:
      labels:
        app: devpath-platform-svc
    spec:
      enableServiceLinks: false
      containers:
        - name: devpath-platform-svc
          # 이미지 태그는 ArgoCD Image Updater 또는 CI가 교체한다.
          image: ghcr.io/devpathai/devpath-platform-svc:main
          ports:
            - containerPort: 8080
          # OAuth 클라이언트 자격증명: SealedSecret이 복호화한 Secret `platform-oauth`를 참조.
          # optional: true — Secret 미설정 시에도 pod가 기동(앱은 application.yml dummy 기본값).
          # 실제 값은 docs/sealed-secrets-oauth.md 절차로 SealedSecret 커밋 후 주입된다.
          env:
            - name: GITHUB_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: platform-oauth
                  key: github-client-id
                  optional: true
            - name: GITHUB_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: platform-oauth
                  key: github-client-secret
                  optional: true
            - name: GOOGLE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: platform-oauth
                  key: google-client-id
                  optional: true
            - name: GOOGLE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: platform-oauth
                  key: google-client-secret
                  optional: true
            - name: DB_URL
              valueFrom:
                secretKeyRef:
                  name: platform-db
                  key: db-url
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: platform-db
                  key: db-user
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: platform-db
                  key: db-password
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: devpath-jwt
                  key: jwt-secret
            - name: KAFKA_BOOTSTRAP
              value: "devpath-kafka-bootstrap.kafka.svc:9092"
            - name: REDIS_HOST
              value: "redis.devpath.svc"
            - name: APP_WEB_URL
              value: "https://app.leva.ai.kr"
            - name: APP_ADMIN_URL
              value: "https://admin.leva.ai.kr"
            - name: COOKIE_DOMAIN
              value: ".leva.ai.kr"
            - name: COOKIE_SECURE
              value: "true"
            - name: BETA_ADMIN_EMAILS
              value: "deepestdark@gmail.com"
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi

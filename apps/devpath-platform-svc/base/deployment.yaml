apiVersion: apps/v1
kind: Deployment
metadata:
  name: devpath-platform-svc
  labels:
    app: devpath-platform-svc
spec:
  replicas: 1
  selector:
    matchLabels:
      app: devpath-platform-svc
  template:
    metadata:
      labels:
        app: devpath-platform-svc
    spec:
      enableServiceLinks: false
      containers:
        - name: devpath-platform-svc
          # 이미지 태그는 ArgoCD Image Updater 또는 CI가 교체한다.
          image: ghcr.io/devpathai/devpath-platform-svc:main
          ports:
            - containerPort: 8080
          # OAuth 클라이언트 자격증명: SealedSecret이 복호화한 Secret `platform-oauth`를 참조.
          # optional: true — Secret 미설정 시에도 pod가 기동(앱은 application.yml dummy 기본값).
          # 실제 값은 docs/sealed-secrets-oauth.md 절차로 SealedSecret 커밋 후 주입된다.
          env:
            - name: GITHUB_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: platform-oauth
                  key: github-client-id
                  optional: true
            - name: GITHUB_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: platform-oauth
                  key: github-client-secret
                  optional: true
            - name: GOOGLE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: platform-oauth
                  key: google-client-id
                  optional: true
            - name: GOOGLE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: platform-oauth
                  key: google-client-secret
                  optional: true
            - name: DB_URL
              valueFrom:
                secretKeyRef:
                  name: platform-db
                  key: db-url
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: platform-db
                  key: db-user
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: platform-db
                  key: db-password
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: devpath-jwt
                  key: jwt-secret
            - name: TURNSTILE_SECRET
              valueFrom:
                secretKeyRef:
                  name: platform-turnstile
                  key: turnstile-secret
            - name: TURNSTILE_HOSTNAMES
              value: "leva.ai.kr"
            - name: PUBLIC_SUPPORT_RATE_LIMIT_HMAC_SECRET
              valueFrom:
                secretKeyRef:
                  name: platform-public-support
                  key: rate-limit-hmac-secret
            - name: KAFKA_BOOTSTRAP
              value: "devpath-kafka-bootstrap.kafka.svc:9092"
            - name: REDIS_HOST
              value: "redis.devpath.svc"
            - name: APP_WEB_URL
              value: "https://app.leva.ai.kr"
            - name: APP_ADMIN_URL
              value: "https://admin.leva.ai.kr"
            - name: COOKIE_DOMAIN
              value: ".leva.ai.kr"
            - name: COOKIE_SECURE
              value: "true"
            - name: BETA_ADMIN_EMAILS
              value: "deepestdark@outlook.kr"
            # 멘토 코드 원문은 저장하지 않고 이 키로 HMAC만 저장한다. Secret 미설정 시
            # pod를 띄우지 않아 테스트 기본키가 운영에 사용되는 것을 막는다.
            - name: MENTOR_INVITE_CODE_HMAC_SECRET
              valueFrom:
                secretKeyRef:
                  name: mentor-access
                  key: invite-code-hmac-secret
            # 메일 발송 consumer와 provider 성공 감사가 배포되기 전에는 대기 사용자를
            # 무통보 활성화하지 않는다. 후속 릴리스에서 전달 경로 검증 후에만 켠다.
            - name: MENTOR_INVITE_BATCH_ENABLED
              value: "false"
            - name: MENTOR_INVITE_BATCH_CRON
              value: "0 0 10 * * *"
            - name: MENTOR_INVITE_BATCH_ZONE
              value: "Asia/Seoul"
            - name: MENTOR_INVITE_BATCH_CHUNK_SIZE
              value: "25"
            - name: MENTOR_INVITE_BATCH_DAILY_CAP
              value: "100"
            # 프록시(Traefik→gateway) 뒤에서 X-Forwarded-*로 baseUrl 생성 — OAuth redirect_uri가
            # 내부 svc DNS로 만들어져 GitHub 콜백 불일치(404) 나던 문제의 해소
            - name: SERVER_FORWARD_HEADERS_STRATEGY
              value: "framework"
            # OAuth redirect_uri를 절대값으로 확정(이중 보장 — 프록시 헤더 체인과 무관하게 동작)
            - name: SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GITHUB_REDIRECTURI
              value: "https://api.leva.ai.kr/login/oauth2/code/github"
            - name: SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_REDIRECTURI
              value: "https://api.leva.ai.kr/login/oauth2/code/google"
            # RDS db.t4g.micro max_connections(~85) 보호: 7 svc × 기본 풀 10이면 롤링 시 슬롯 고갈
            - name: SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE
              value: "5"
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi

apiVersion: apps/v1
kind: Deployment
metadata:
  name: devpath-lcs-svc
  labels:
    app: devpath-lcs-svc
spec:
  replicas: 1
  selector:
    matchLabels:
      app: devpath-lcs-svc
  template:
    metadata:
      labels:
        app: devpath-lcs-svc
    spec:
      enableServiceLinks: false
      containers:
        - name: devpath-lcs-svc
          # 이미지 태그는 ArgoCD Image Updater 또는 CI가 교체한다.
          image: ghcr.io/devpathai/devpath-lcs-svc:main
          ports:
            - containerPort: 8080
          env:
            - name: DB_URL
              valueFrom:
                secretKeyRef:
                  name: platform-db
                  key: db-url
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: platform-db
                  key: db-user
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: platform-db
                  key: db-password
            - name: DEVPATH_AUTH_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: devpath-jwt
                  key: jwt-secret
            - name: REDIS_HOST
              value: "redis.devpath.svc"
            - name: SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE
              value: "5"
            - name: LEARNING_URI
              value: "http://devpath-learning-svc.devpath.svc:8080"
            - name: SANDBOX_URI
              value: "http://devpath-sandbox-svc.devpath.svc:8080"
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi

apiVersion: v1
kind: ServiceAccount
metadata:
  name: devpath-migration-fence
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: devpath-migration-fence-reader
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: devpath-migration-fence-reader
subjects:
  - kind: ServiceAccount
    name: devpath-migration-fence
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: devpath-migration-fence-reader

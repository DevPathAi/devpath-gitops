apiVersion: batch/v1
kind: Job
metadata:
  name: devpath-flyway-migrate
spec:
  # Base/main is inert. Only the protected sealed M commit may unsuspend a
  # digest-derived Job name after selecting the candidate image digest.
  suspend: true
  backoffLimit: 3
  template:
    spec:
      restartPolicy: Never
      initContainers:
        - name: sandbox-low-lock-preflight
          image: postgres:17-alpine@sha256:979c4379dd698aba0b890599a6104e082035f98ef31d9b9291ec22f2b13059ca
          command: ["/bin/sh", "/opt/devpath/preflight.sh"]
          securityContext:
            runAsNonRoot: true
            runAsUser: 70
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          env:
            - name: FLYWAY_URL
              valueFrom:
                secretKeyRef:
                  name: platform-db
                  key: db-url
            - name: FLYWAY_USER
              valueFrom:
                secretKeyRef:
                  name: platform-db
                  key: db-user
            - name: FLYWAY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: platform-db
                  key: db-password
            - name: EXPECTED_ET8_SHARED_COMMIT
              value: "2b03c38934fdd19332da59107e4330a3af92d078"
            - name: EXPECTED_SHARED_COMMIT
              value: "96a5cdb9d95689759afb229b4d1e29b9bd221793"
            - name: ET8_FLYWAY_VERSION
              value: "202608161008"
            - name: TARGET_FLYWAY_VERSION
              value: "202608161011"
            - name: MAINTENANCE_APPROVED
              valueFrom:
                configMapKeyRef:
                  name: sandbox-migration-gate
                  key: maintenance-approved
            - name: MAX_SANDBOX_SESSIONS_BYTES
              valueFrom:
                configMapKeyRef:
                  name: sandbox-migration-gate
                  key: max-sandbox-sessions-bytes
            - name: LOCK_TIMEOUT_MS
              value: "2000"
            - name: STATEMENT_TIMEOUT_MS
              value: "30000"
          volumeMounts:
            - name: sandbox-migration-preflight
              mountPath: /opt/devpath
              readOnly: true
      containers:
        - name: flyway
          # 중앙 스키마(devpath-shared)의 마이그레이션을 RDS에 적용한다.
          # SQL과 nontransactional Java runner는 이미지에 내장된다
          # (shared Dockerfile.migration: /flyway/sql + /flyway/drivers).
          # 자격은 platform-db SealedSecret(Flyway 표준 env FLYWAY_URL/USER/PASSWORD).
          # sealed migration commit이 digest-derived Job 이름으로 패치해 새 Job을 생성한다.
          image: ghcr.io/devpathai/devpath-migration:main
          securityContext:
            runAsNonRoot: true
            # flyway 공식 이미지의 기본 유저가 root라 kubelet이 거부 — 비루트 UID 명시(CLI는 임의 UID 실행 가능)
            runAsUser: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          env:
            - name: FLYWAY_URL
              valueFrom:
                secretKeyRef:
                  name: platform-db
                  key: db-url
            - name: FLYWAY_USER
              valueFrom:
                secretKeyRef:
                  name: platform-db
                  key: db-user
            - name: FLYWAY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: platform-db
                  key: db-password
            - name: FLYWAY_POSTGRESQL_TRANSACTIONAL_LOCK
              value: "false"
            - name: EXPECTED_ET8_SHARED_COMMIT
              value: "2b03c38934fdd19332da59107e4330a3af92d078"
            - name: EXPECTED_SHARED_COMMIT
              value: "96a5cdb9d95689759afb229b4d1e29b9bd221793"
            - name: ET8_FLYWAY_VERSION
              value: "202608161008"
            - name: TARGET_FLYWAY_VERSION
              value: "202608161011"
          command: ["/bin/sh", "-ec"]
          args:
            - |
              test "$EXPECTED_ET8_SHARED_COMMIT" = "2b03c38934fdd19332da59107e4330a3af92d078"
              test "$EXPECTED_SHARED_COMMIT" = "96a5cdb9d95689759afb229b4d1e29b9bd221793"
              test "$ET8_FLYWAY_VERSION" = "202608161008"
              test "$TARGET_FLYWAY_VERSION" = "202608161011"
              test -f /flyway/sql/V202608161008__validate_sandbox_terminal_reconciliation_fence.sql
              test -f /flyway/sql/V202608161011__validate_lcs_mentor_snapshot_contract.sql
              runner_jar="$(find /flyway/drivers -maxdepth 1 -type f -name '*-migration-runner.jar' -print -quit)"
              test -n "$runner_jar"
              migration_locations="filesystem:/flyway/sql,classpath:db/migration"
              flyway -locations="$migration_locations" -target="$TARGET_FLYWAY_VERSION" migrate
              flyway -locations="$migration_locations" validate
              printf 'mission-spine-flyway-target=%s status=validated\n' "$TARGET_FLYWAY_VERSION"
      volumes:
        - name: sandbox-migration-preflight
          configMap:
            name: sandbox-migration-preflight
            defaultMode: 365

apiVersion: apps/v1
kind: Deployment
metadata:
  name: devpath-learning-svc
  labels:
    app: devpath-learning-svc
spec:
  replicas: 1
  selector:
    matchLabels:
      app: devpath-learning-svc
  template:
    metadata:
      labels:
        app: devpath-learning-svc
    spec:
      enableServiceLinks: false
      containers:
        - name: devpath-learning-svc
          # 이미지 태그는 ArgoCD Image Updater 또는 CI가 교체한다.
          image: ghcr.io/devpathai/devpath-learning-svc:main
          ports:
            - containerPort: 8080
          env:
            - name: DB_URL
              valueFrom:
                secretKeyRef:
                  name: platform-db
                  key: db-url
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: platform-db
                  key: db-user
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: platform-db
                  key: db-password
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: devpath-jwt
                  key: jwt-secret
            - name: KAFKA_BOOTSTRAP
              value: "devpath-kafka-bootstrap.kafka.svc:9092"
            - name: REDIS_HOST
              value: "redis.devpath.svc"
            - name: SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE
              value: "5"
            - name: AI_SVC_BASE_URL
              value: "http://devpath-ai-svc.devpath.svc:8080"
            # 스톱갭(2026-07-28): CPU Ollama path 생성 ~수백초 → 기본 AI_SVC_TIMEOUT(PT8S)·SSE(180s)로 실패.
            # 베타 SLO 완화 — SSE는 생성 상한보다 길게. 근본 해소는 GPU(Phase B).
            - name: AI_SVC_TIMEOUT
              value: "PT600S"
            - name: DEVPATH_PATH_SSE_TIMEOUT_MS
              value: "630000"
            - name: NOTIFICATION_SVC_BASE_URL
              value: "http://devpath-notification-svc.devpath.svc:8080"
            - name: COMMUNITY_SVC_BASE_URL
              value: "http://devpath-community-svc.devpath.svc:8080"
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi

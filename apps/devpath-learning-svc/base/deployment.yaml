apiVersion: apps/v1
kind: Deployment
metadata:
  name: devpath-learning-svc
  labels:
    app: devpath-learning-svc
spec:
  replicas: 1
  selector:
    matchLabels:
      app: devpath-learning-svc
  template:
    metadata:
      labels:
        app: devpath-learning-svc
    spec:
      enableServiceLinks: false
      containers:
        - name: devpath-learning-svc
          # 이미지 태그는 ArgoCD Image Updater 또는 CI가 교체한다.
          image: ghcr.io/devpathai/devpath-learning-svc:main
          ports:
            - containerPort: 8080
          env:
            - name: DB_URL
              valueFrom:
                secretKeyRef:
                  name: platform-db
                  key: db-url
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: platform-db
                  key: db-user
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: platform-db
                  key: db-password
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: devpath-jwt
                  key: jwt-secret
            - name: KAFKA_BOOTSTRAP
              value: "devpath-kafka-bootstrap.kafka.svc:9092"
            - name: REDIS_HOST
              value: "redis.devpath.svc"
            - name: SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE
              value: "5"
            - name: AI_SVC_BASE_URL
              value: "http://devpath-ai-svc.devpath.svc:8080"
            # 학습경로 생성 호출은 ai-svc 를 거쳐 GPU Ollama 까지 간다. 코드 기본값 PT8S 로는
            # 매번 끊겨 결과가 버려진다. 생성은 비동기 작업으로 돌므로 이 값이 길어도 요청 스레드가
            # 묶이지 않는다.
            # ai-svc 의 OLLAMA_PATH_TIMEOUT(PT300S) × 재시도 1회 + 여유를 덮어야 한다.
            - name: AI_SVC_TIMEOUT
              value: "PT660S"
            - name: NOTIFICATION_SVC_BASE_URL
              value: "http://devpath-notification-svc.devpath.svc:8080"
            - name: COMMUNITY_SVC_BASE_URL
              value: "http://devpath-community-svc.devpath.svc:8080"
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi

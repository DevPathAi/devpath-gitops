apiVersion: apps/v1
kind: Deployment
metadata:
  name: devpath-lcs-svc
spec:
  template:
    spec:
      automountServiceAccountToken: false
      containers:
        - name: devpath-lcs-svc
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 60
          env:
            - name: REDIS_HOST
              value: redis.devpath-staging.svc
            - name: LEARNING_URI
              value: http://devpath-learning-svc.devpath-staging.svc:8080
            - name: SANDBOX_URI
              value: http://devpath-sandbox-svc.devpath-staging.svc:8080
            - name: MISSION_RELEASE_CONTROL_ENABLED
              value: "true"
            - name: INTERNAL_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: mission-spine-release-control
                  key: internal-token

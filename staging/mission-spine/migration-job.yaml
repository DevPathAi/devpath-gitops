apiVersion: batch/v1
kind: Job
metadata:
  name: mission-spine-staging-migration-v202609051004
spec:
  backoffLimit: 3
  template:
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      containers:
        - name: flyway
          image: ghcr.io/devpathai/devpath-migration@sha256:81029e190726c7967a6c840caee1735586da3a694081982b29261b2a54436e2b
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          env:
            - name: FLYWAY_URL
              valueFrom:
                secretKeyRef:
                  name: platform-db
                  key: db-url
            - name: FLYWAY_USER
              valueFrom:
                secretKeyRef:
                  name: platform-db
                  key: db-user
            - name: FLYWAY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: platform-db
                  key: db-password
          command: ["/bin/sh", "-ec"]
          args:
            - |
              migration_locations="filesystem:/flyway/sql,classpath:db/migration"
              flyway -locations="$migration_locations" -target="202609051004" migrate
              flyway -locations="$migration_locations" -target="202609051004" validate

# GPU 노드에만 도는 NVIDIA device plugin. 이 플러그인이 있어야 kubelet 이 nvidia.com/gpu 를
# 할당 가능 자원으로 광고한다. cert-manager 와 마찬가지로 클러스터 리소스이므로 ArgoCD 가 아니라
# 서버 노드에서 직접 적용한다(apps/* 에 두면 ApplicationSet 이 앱으로 오인한다).
#
#   kubectl apply -f infra/nvidia-device-plugin/daemonset.yaml
#
# 버전은 NVIDIA/k8s-device-plugin 릴리스 실측값(2026-08-17 기준 최신 v0.19.3).
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: nvidia-device-plugin-daemonset
  namespace: kube-system
spec:
  selector:
    matchLabels:
      name: nvidia-device-plugin-ds
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        name: nvidia-device-plugin-ds
    spec:
      # GPU 노드에만 배치한다. 노드에는 devpath.ai/gpu=true:NoSchedule 테인트가 걸려 있으므로
      # 이 톨러레이션이 없으면 플러그인 자신이 스케줄되지 못한다.
      nodeSelector:
        devpath.ai/gpu: "true"
      tolerations:
        - key: devpath.ai/gpu
          operator: Equal
          value: "true"
          effect: NoSchedule
        - key: CriticalAddonsOnly
          operator: Exists
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      priorityClassName: system-node-critical
      runtimeClassName: nvidia
      containers:
        - name: nvidia-device-plugin-ctr
          image: nvcr.io/nvidia/k8s-device-plugin:v0.19.3
          env:
            - name: FAIL_ON_INIT_ERROR
              value: "true"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: device-plugin
              mountPath: /var/lib/kubelet/device-plugins
      volumes:
        - name: device-plugin
          hostPath:
            path: /var/lib/kubelet/device-plugins
